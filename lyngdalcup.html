<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lyngdal Cup Mini, kamper og spilletid | G9 Berge/Årnes/LKG</title>
<meta name="description" content="Kampoppsett og spilletidsverktøy for G9 Berge/Årnes/LKG under Lyngdal Cup Mini 17. oktober 2026.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://erlendhaddeland.no/lyngdalcup.html">
<meta name="theme-color" content="#14163a">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200;12..96,400;12..96,500;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
/* Siden er et verktøy til sidelinja, så alt er laget for tommelen på en telefon */
.cup{max-width:620px;margin:0 auto;padding:20px 16px 80px;}
.cup h1{font-size:30px;line-height:1.1;font-weight:800;margin:4px 0 4px;letter-spacing:-.01em;}
.cup h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dempet);font-weight:600;margin:34px 0 10px;}
.cup-under{color:var(--dempet);margin:0 0 18px;font-size:15px;}
.cup button{font:inherit;color:inherit;background:none;border:0;padding:0;}
.cup-valg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--strek);}
.cup-valg button{padding:12px 4px;font-weight:600;font-size:15px;border-right:1px solid var(--strek);}
.cup-valg button:last-child{border-right:0;}
.cup-valg button[aria-pressed="true"]{background:var(--lys);color:var(--natt);}

.cup-neste{margin-top:18px;padding:16px 18px;background:var(--dypbla);border-left:4px solid var(--aksent);}
.cup-neste b{display:block;font-size:22px;line-height:1.2;font-weight:800;}
.cup-neste span{color:var(--brod);font-size:15px;}

.cup-kamper{list-style:none;margin:0;padding:0;border-top:1px solid var(--strek);}
.cup-kamper li{border-bottom:1px solid var(--strek);}
.cup-kamper button{display:grid;grid-template-columns:64px 1fr auto;gap:2px 12px;align-items:center;width:100%;text-align:left;padding:12px 6px;}
.cup-kamper .tid{font-weight:800;font-size:18px;}
.cup-kamper .mot{font-weight:500;}
.cup-kamper .bane{font-weight:600;color:var(--aksent);white-space:nowrap;}
.cup-kamper .info{grid-column:2 / 4;font-size:13px;color:var(--dempet);}
.cup-kamper button[aria-current="true"]{background:var(--dypbla);box-shadow:inset 4px 0 0 var(--aksent);}
.cup-kamper .lagmerke{display:inline-block;font-size:12px;font-weight:700;padding:1px 6px;margin-right:6px;background:var(--brod);color:var(--natt);}
.cup-kamper .lag3 .lagmerke{background:var(--aksent);}
.cup-pause{font-size:13px;color:var(--dempet);padding:4px 6px 4px 82px;}

.cup-klokke{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:6px 0 12px;}
.cup-klokke .ur{font-size:64px;font-weight:200;line-height:1;letter-spacing:-.02em;}
.cup-klokke .av{color:var(--dempet);font-size:18px;}
.cup-klokke .siden{text-align:right;font-size:14px;color:var(--dempet);line-height:1.3;}
.cup-klokke .siden b{display:block;font-size:22px;color:var(--lys);font-weight:600;}
.cup-knapper{display:flex;gap:8px;flex-wrap:wrap;}
.cup-knapper button{padding:14px 18px;font-weight:600;border:1px solid var(--strek);}
.cup-knapper .hoved{flex:1 1 160px;background:var(--aksent);color:var(--natt);border-color:var(--aksent);font-size:18px;}
.cup-knapper .hoved.pause{background:var(--lys);border-color:var(--lys);}

.cup-forslag{margin:16px 0 4px;padding:14px 16px;border:1px solid var(--strek);display:flex;align-items:center;justify-content:space-between;gap:12px;}
.cup-forslag p{margin:0;line-height:1.35;}
.cup-forslag small{display:block;color:var(--dempet);font-size:13px;}
.cup-forslag button{padding:12px 18px;font-weight:700;background:var(--lys);color:var(--natt);flex:0 0 auto;}
.cup-forslag.na{background:var(--aksent);color:var(--natt);border-color:var(--aksent);}
.cup-forslag.na small{color:var(--dypbla);}
.cup-forslag.na button{background:var(--natt);color:var(--lys);}

.cup-rolle{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dempet);font-weight:600;margin:20px 0 6px;display:flex;justify-content:space-between;}
.cup-spillere{display:grid;gap:6px;}
.cup-spiller{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;width:100%;text-align:left;padding:13px 14px;background:var(--kortflate);border-left:4px solid var(--strek);font-size:17px;}
.cup-spiller .navn{font-weight:600;}
.cup-spiller .kamp,.cup-spiller .dag{font-size:15px;text-align:right;min-width:54px;}
.cup-spiller .dag{color:var(--dempet);}
.cup-spiller.bane{border-left-color:var(--aksent);}
.cup-spiller.keeper{border-left-color:var(--kakao);}
.cup-spiller.benk{background:transparent;border:1px solid var(--strek);border-left-width:4px;}
.cup-spiller.merket{outline:2px solid var(--lys);outline-offset:-2px;background:var(--dypbla);}
.cup-spiller .lenge{color:var(--aksent);}
.cup-hint{font-size:14px;color:var(--dempet);margin:10px 0 0;}
.cup-hint.aktiv{color:var(--lys);}

.cup-tabell{width:100%;border-collapse:collapse;font-size:15px;}
.cup-tabell th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dempet);font-weight:600;text-align:right;padding:6px 6px;}
.cup-tabell th:first-child{text-align:left;}
.cup-tabell td{padding:10px 6px;border-top:1px solid var(--strek);text-align:right;white-space:nowrap;}
.cup-tabell td:first-child{text-align:left;white-space:normal;font-weight:600;}
.cup-tabell .stolpe{display:block;height:4px;background:var(--aksent);margin-top:5px;}
.cup-tabell .pluss{color:var(--aksent);}
.cup-tabell .minus{color:var(--rod);}
.cup-tabell tr.borte td{opacity:.45;}
.cup-tabell button{font-size:13px;padding:6px 8px;border:1px solid var(--strek);}

.cup details{margin-top:30px;border-top:1px solid var(--strek);padding-top:12px;}
.cup summary{cursor:var(--kaffe);color:var(--dempet);font-weight:600;padding:6px 0;}
.cup label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--strek);}
.cup input[type="number"]{width:80px;font:inherit;color:var(--lys);background:var(--kortflate);border:1px solid var(--strek);padding:8px;text-align:right;}
.cup .fare{margin-top:14px;padding:12px 16px;border:1px solid var(--feil);color:var(--lys);font-weight:600;}
.cup-tom{color:var(--dempet);}
</style>
</head>
<body>
<a class="hopp" href="#innhold">Hopp til innhold</a>
<main id="innhold" class="cup">
  <h1>Lyngdal Cup Mini</h1>
  <p class="cup-under">Lørdag 17. oktober, Kiwi-banen på Lyngdal stadion. G9 Berge/Årnes/LKG.</p>
  <div id="app"><p class="cup-tom">Laster …</p></div>
  <noscript><p>Verktøyet trenger JavaScript.</p></noscript>
</main>
<script>
(function(){
  'use strict';

  // Kampoppsettet fra Cup Manager, alle kamper på Kiwi-banen
  var LAG={
    1:{navn:'Lyngdal IL 1 Berge/Årnes/LKG',pulje:'B',
      spillere:['Gustav','Eliah','Jonas Fuglestein','Jonas Fredbo','Filip','Bendik','Eirik Emilian'],
      kamper:[
        {fra:'10:25',til:'10:45',mot:'FLIK 3',bane:4},
        {fra:'11:15',til:'11:35',mot:'FLIK 1',bane:2},
        {fra:'12:05',til:'12:25',mot:'Giv Akt IL 1',bane:5},
        {fra:'13:20',til:'13:40',mot:'Lyngdal IL 1 Å/Kvås',bane:5}]},
    2:{navn:'Lyngdal IL 2 Berge/Årnes/LKG',pulje:'A',
      spillere:['Theo','Josva','Viljar','Ugljesa','Misha','Oskar','Isak'],
      kamper:[
        {fra:'10:00',til:'10:20',mot:'FLIK 2',bane:4},
        {fra:'11:40',til:'12:00',mot:'Lyngdal IL 2 Å/Kvås',bane:5},
        {fra:'12:55',til:'13:15',mot:'Hægebostad IL',bane:6},
        {fra:'13:45',til:'14:05',mot:'Giv Akt IL 2',bane:1}]},
    3:{navn:'Lyngdal IL 3 Berge/Årnes/LKG',pulje:'B',
      spillere:['Arne','Johannes','Lucas','Oliver','Illia','Martin','Arvid','Matei'],
      kamper:[
        {fra:'10:25',til:'10:45',mot:'Lyngdal IL 1 Å/Kvås',bane:3},
        {fra:'11:15',til:'11:35',mot:'Giv Akt IL 1',bane:1},
        {fra:'12:05',til:'12:25',mot:'FLIK 3',bane:4},
        {fra:'13:20',til:'13:40',mot:'FLIK 1',bane:1}]}
  };
  var PAA_BANEN=4; // utespillere, keeper kommer i tillegg
  var NOKKEL='lyngdalcup-2026';
  var app=document.getElementById('app');
  var merket=null, varslet={}, laas=null;

  // Lagring
  var lager;
  try{lager=JSON.parse(localStorage.getItem(NOKKEL))||{};}catch(e){lager={};}
  lager.lag=lager.lag||{};
  [1,2,3].forEach(function(n){
    var l=lager.lag[n]=lager.lag[n]||{};
    l.ute=l.ute||{}; l.kamper=l.kamper||{};
    if(!l.lengde) l.lengde=20;
  });
  var fraAdresse=new URLSearchParams(location.search).get('lag');
  if(fraAdresse && /^(1|2|3|alle)$/.test(fraAdresse)) lager.valg=fraAdresse;
  if(!lager.valg) lager.valg='alle';
  function lagre(){try{localStorage.setItem(NOKKEL,JSON.stringify(lager));}catch(e){}}

  // Hjelpere
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function tidspunkt(hhmm){var d=hhmm.split(':');return new Date(2026,9,17,+d[0],+d[1]).getTime();}
  function mmss(ms){ms=Math.max(0,Math.round(ms/1000));var m=Math.floor(ms/60),s=ms%60;return m+':'+(s<10?'0':'')+s;}
  function varighet(ms){
    var min=Math.round(ms/60000);
    if(min<60) return min+' min';
    var t=Math.floor(min/60),r=min%60;
    return t+' t'+(r?' '+r+' min':'');
  }
  function L(n){return lager.lag[n];}
  function tilgjengelige(n){return LAG[n].spillere.filter(function(s){return !L(n).ute[s];});}
  function sum(n,felt,navn){
    var t=0,k=L(n).kamper;
    for(var i in k) t+=(k[i][felt][navn]||0);
    return t;
  }
  function intervall(n){
    // Ett bytte om gangen, jevnt fordelt: hver spiller er inne PAA_BANEN runder og ute resten
    var ute=tilgjengelige(n).length-1;
    if(ute<=PAA_BANEN) return 0;
    if(L(n).intervall) return L(n).intervall*60000;
    return Math.round(L(n).lengde/ute*2)/2*60000;
  }

  // Klokka bygger på tidsstempler, så den går riktig selv om skjermen låses
  function avregn(k,lengde){
    if(!k.gaar) return;
    var na=Date.now(), d=Math.min(na-k.sist,lengde-k.klokke);
    if(d>0){
      k.klokke+=d;
      k.bane.forEach(function(s){k.tid[s]=(k.tid[s]||0)+d;});
      if(k.keeper) k.keeperTid[k.keeper]=(k.keeperTid[k.keeper]||0)+d;
    }
    k.sist=na;
    if(k.klokke>=lengde){k.gaar=false;k.ferdig=true;slippSkjerm();}
  }
  function avregnAlle(){
    [1,2,3].forEach(function(n){
      var k=L(n).kamper;
      for(var i in k) avregn(k[i],L(n).lengde*60000);
    });
  }

  // Foreslått oppstilling: minst keepertid i mål, minst spilletid på banen
  function nyKamp(n,i){
    var alle=tilgjengelige(n), rot=i%Math.max(alle.length,1);
    var rekke=alle.slice(rot).concat(alle.slice(0,rot));
    var keeper=rekke.slice().sort(function(a,b){
      return (sum(n,'keeperTid',a)-sum(n,'keeperTid',b))||(sum(n,'tid',b)-sum(n,'tid',a));
    })[0]||null;
    var resten=rekke.filter(function(s){return s!==keeper;}).sort(function(a,b){return sum(n,'tid',a)-sum(n,'tid',b);});
    var k={keeper:keeper,bane:resten.slice(0,PAA_BANEN),benk:resten.slice(PAA_BANEN),
      gaar:false,ferdig:false,klokke:0,sist:0,sisteBytte:0,bytter:0,inn:{},ut:{},tid:{},keeperTid:{}};
    k.bane.forEach(function(s){k.inn[s]=0;});
    return k;
  }
  function kamp(n,i){
    var l=L(n);
    if(!l.kamper[i]){l.kamper[i]=nyKamp(n,i);lagre();}
    return l.kamper[i];
  }
  function valgtKamp(n){
    var l=L(n);
    if(l.valgt!=null) return l.valgt;
    for(var i=0;i<4;i++) if(!(l.kamper[i]&&l.kamper[i].ferdig)) return i;
    return 3;
  }

  function rolle(k,s){
    if(k.keeper===s) return 'keeper';
    if(k.bane.indexOf(s)>-1) return 'bane';
    if(k.benk.indexOf(s)>-1) return 'benk';
    return null;
  }
  function settRolle(k,s,r){
    if(r==='keeper') k.keeper=s;
    else k[r].push(s);
    if(r==='bane') k.inn[s]=k.klokke;
    if(r==='benk') k.ut[s]=k.klokke;
  }
  function fjern(k,s){
    if(k.keeper===s) k.keeper=null;
    k.bane=k.bane.filter(function(x){return x!==s;});
    k.benk=k.benk.filter(function(x){return x!==s;});
  }
  function bytt(n,k,a,b){
    var ra=rolle(k,a), rb=rolle(k,b);
    if(!ra||!rb||ra===rb) return false;
    avregn(k,L(n).lengde*60000);
    k.angre={keeper:k.keeper,bane:k.bane.slice(),benk:k.benk.slice(),inn:JSON.parse(JSON.stringify(k.inn)),ut:JSON.parse(JSON.stringify(k.ut)),sisteBytte:k.sisteBytte,bytter:k.bytter};
    // Bytt plass i lista, så rekkefølgen på banen står stille
    function plass(s,r){return r==='keeper'?-1:k[r].indexOf(s);}
    var pa=plass(a,ra), pb=plass(b,rb);
    if(ra==='keeper') k.keeper=b; else k[ra][pa]=b;
    if(rb==='keeper') k.keeper=a; else k[rb][pb]=a;
    [[a,rb],[b,ra]].forEach(function(p){
      if(p[1]==='bane') k.inn[p[0]]=k.klokke;
      if(p[1]==='benk') k.ut[p[0]]=k.klokke;
    });
    if((ra==='bane'&&rb==='benk')||(ra==='benk'&&rb==='bane')){k.sisteBytte=k.klokke;k.bytter++;}
    return true;
  }

  // Byttforslag: den med minst spilletid i dag inn, den med mest ut
  function forslag(n,k){
    if(!k.benk.length||!k.bane.length) return null;
    var inn=k.benk.slice().sort(function(a,b){
      return (sum(n,'tid',a)-sum(n,'tid',b))||((k.ut[a]||0)-(k.ut[b]||0));
    })[0];
    var ut=k.bane.slice().sort(function(a,b){
      return (sum(n,'tid',b)-sum(n,'tid',a))||((k.inn[a]||0)-(k.inn[b]||0));
    })[0];
    var iv=intervall(n), igjen=L(n).lengde*60000-k.klokke;
    var na=k.gaar && iv>0 && k.klokke-k.sisteBytte>=iv && igjen>60000;
    return {inn:inn,ut:ut,na:na,iv:iv};
  }

  // Skjermen skal ikke slukne midt i kampen
  function holdSkjerm(){
    try{if(navigator.wakeLock&&!laas) navigator.wakeLock.request('screen').then(function(w){laas=w;w.addEventListener('release',function(){laas=null;});}).catch(function(){});}catch(e){}
  }
  function slippSkjerm(){try{if(laas){laas.release();laas=null;}}catch(e){}}

  // Kampoversikt
  function nesteTekst(n){
    var na=Date.now(), km=LAG[n].kamper;
    for(var i=0;i<km.length;i++){
      var fra=tidspunkt(km[i].fra), til=tidspunkt(km[i].til);
      if(til<=na) continue;
      if(fra<=na) return {b:'Pågår nå, bane '+km[i].bane,s:'Mot '+km[i].mot+', ferdig '+km[i].til};
      var om=fra-na;
      return {b:(om>12*3600000?'Første kamp lørdag kl. '+km[i].fra:'Neste kamp om '+varighet(om)),s:'Kl. '+km[i].fra+' mot '+km[i].mot+', bane '+km[i].bane};
    }
    return {b:'Ferdig for i dag',s:'Godt jobbet, alle sammen.'};
  }
  function kampliste(n,valgt){
    var km=LAG[n].kamper, h='<ul class="cup-kamper">';
    km.forEach(function(m,i){
      var k=L(n).kamper[i], status='';
      if(k&&k.ferdig) status='Ferdig, '+k.bytter+' bytter';
      else if(k&&k.gaar) status='Klokka går, '+mmss(k.klokke);
      else if(k&&k.klokke) status='Pause, '+mmss(k.klokke);
      h+='<li><button type="button" data-a="kamp" data-i="'+i+'" aria-current="'+(i===valgt)+'">'
        +'<span class="tid">'+m.fra+'</span><span class="mot">'+esc(m.mot)+'</span><span class="bane">Bane '+m.bane+'</span>'
        +'<span class="info">Kamp '+(i+1)+', pulje '+LAG[n].pulje+(status?'. '+status:'')+'</span></button></li>';
      if(i<km.length-1){
        var p=tidspunkt(km[i+1].fra)-tidspunkt(m.til);
        h+='<li class="cup-pause">'+varighet(p)+' til neste kamp</li>';
      }
    });
    return h+'</ul>';
  }
  function alleKamper(){
    var rader=[];
    [1,2,3].forEach(function(n){LAG[n].kamper.forEach(function(m){rader.push({n:n,m:m});});});
    rader.sort(function(a,b){return a.m.fra.localeCompare(b.m.fra)||a.n-b.n;});
    var na=Date.now(), h='<ul class="cup-kamper">';
    rader.forEach(function(r){
      var forbi=tidspunkt(r.m.til)<=na;
      h+='<li class="lag'+r.n+'"'+(forbi?' style="opacity:.45"':'')+'><button type="button" data-a="lagkamp" data-n="'+r.n+'" data-i="'+LAG[r.n].kamper.indexOf(r.m)+'">'
        +'<span class="tid">'+r.m.fra+'</span><span class="mot"><span class="lagmerke">Lag '+r.n+'</span>mot '+esc(r.m.mot)+'</span><span class="bane">Bane '+r.m.bane+'</span>'
        +'<span class="info">Pulje '+LAG[r.n].pulje+', ferdig '+r.m.til+'</span></button></li>';
    });
    return h+'</ul>';
  }

  // Spilletid
  function spillerKnapp(n,k,s,r){
    var lenge='';
    if(r==='bane') lenge=k.klokke-(k.inn[s]||0);
    var kampTid=r==='keeper'?(k.keeperTid[s]||0):(k.tid[s]||0);
    return '<button type="button" class="cup-spiller '+r+(merket===s?' merket':'')+'" data-a="spiller" data-s="'+esc(s)+'">'
      +'<span class="navn">'+esc(s)+(r==='bane'?' <small class="lenge" data-t="lenge" data-s="'+esc(s)+'">'+mmss(lenge)+'</small>':'')+'</span>'
      +'<span class="kamp" data-t="'+(r==='keeper'?'kk':'k')+'" data-s="'+esc(s)+'">'+mmss(kampTid)+'</span>'
      +'<span class="dag" data-t="d" data-s="'+esc(s)+'">'+mmss(sum(n,'tid',s))+'</span></button>';
  }
  function forslagHtml(n,k){
    var f=forslag(n,k);
    if(!f) return '';
    var tekst=f.na?'Tid for bytte':(k.gaar?'Neste bytte':'Første bytte');
    return '<div class="cup-forslag'+(f.na?' na':'')+'" data-noekkel="'+esc(f.inn+'|'+f.ut+'|'+f.na)+'"><p><small>'+tekst+'</small><b>'+esc(f.inn)+'</b> inn, <b>'+esc(f.ut)+'</b> ut</p>'
      +'<button type="button" data-a="forslag">Bytt</button></div>';
  }
  function spilletid(n,i){
    var k=kamp(n,i), m=LAG[n].kamper[i], lengde=L(n).lengde*60000, iv=intervall(n);
    var h='<h2 id="klokka">Kamp '+(i+1)+': kl. '+m.fra+' mot '+esc(m.mot)+', bane '+m.bane+'</h2>';
    h+='<div class="cup-klokke"><div><span class="ur" data-t="klokke">'+mmss(k.klokke)+'</span> <span class="av">/ '+L(n).lengde+':00</span></div>'
      +'<div class="siden">Siden bytte<b data-t="siden">'+mmss(k.klokke-k.sisteBytte)+'</b>'+(iv?'bytt hvert '+mmss(iv):'ingen på benken')+'</div></div>';
    h+='<div class="cup-knapper">';
    if(k.ferdig) h+='<button type="button" class="hoved" data-a="gjenapne">Ferdig. Åpne kampen igjen</button>';
    else if(k.gaar) h+='<button type="button" class="hoved pause" data-a="pause">Pause</button><button type="button" data-a="ferdig">Kampen er ferdig</button>';
    else h+='<button type="button" class="hoved" data-a="start">'+(k.klokke?'Fortsett':'Start kampen')+'</button>'+(k.klokke?'<button type="button" data-a="ferdig">Kampen er ferdig</button>':'');
    h+='</div>';
    h+='<div data-t="forslag">'+forslagHtml(n,k)+'</div>';
    h+='<div class="cup-rolle"><span>Keeper</span><span>i mål &nbsp; ute i dag</span></div><div class="cup-spillere">'
      +(k.keeper?spillerKnapp(n,k,k.keeper,'keeper'):'<p class="cup-tom">Ingen keeper. Trykk en spiller, så keeperplassen.</p>')+'</div>';
    h+='<div class="cup-rolle"><span>På banen ('+k.bane.length+')</span><span>kamp &nbsp; i dag</span></div><div class="cup-spillere">'
      +k.bane.map(function(s){return spillerKnapp(n,k,s,'bane');}).join('')+'</div>';
    h+='<div class="cup-rolle"><span>Benken ('+k.benk.length+')</span><span>kamp &nbsp; i dag</span></div><div class="cup-spillere">'
      +(k.benk.length?k.benk.map(function(s){return spillerKnapp(n,k,s,'benk');}).join(''):'<p class="cup-tom">Ingen på benken.</p>')+'</div>';
    h+='<p class="cup-hint'+(merket?' aktiv':'')+'">'+(merket?'Trykk den '+esc(merket)+' skal bytte med. Trykk '+esc(merket)+' igjen for å angre.':'Bytte selv: trykk én spiller, så den andre. Virker også for keeper.')+'</p>';
    if(k.angre) h+='<div class="cup-knapper" style="margin-top:12px"><button type="button" data-a="angre">Angre siste bytte</button></div>';
    return h;
  }
  function avvikTekst(ms){return (ms>=0?'+':'−')+mmss(Math.abs(ms));}
  function snittTid(n){
    var med=tilgjengelige(n);
    return med.reduce(function(t,s){return t+sum(n,'tid',s);},0)/Math.max(med.length,1);
  }
  function dagen(n){
    var alle=LAG[n].spillere, med=tilgjengelige(n);
    var snitt=snittTid(n);
    var maks=Math.max.apply(null,alle.map(function(s){return sum(n,'tid',s);}).concat([1]));
    var h='<h2>Spilletid i dag</h2><table class="cup-tabell"><thead><tr><th>Spiller</th><th>Ute</th><th>Mål</th><th>Mot snitt</th><th></th></tr></thead><tbody>';
    alle.forEach(function(s){
      var t=sum(n,'tid',s), avvik=t-snitt, borte=!!L(n).ute[s];
      h+='<tr'+(borte?' class="borte"':'')+'><td>'+esc(s)+'<span class="stolpe" style="width:'+Math.round(t/maks*100)+'%"></span></td>'
        +'<td data-t="d" data-s="'+esc(s)+'">'+mmss(t)+'</td><td>'+mmss(sum(n,'keeperTid',s))+'</td>'
        +'<td'+(borte?'>borte':' data-t="avvik" data-s="'+esc(s)+'" class="'+(avvik>=0?'pluss':'minus')+'">'+avvikTekst(avvik))+'</td>'
        +'<td><button type="button" data-a="ute" data-s="'+esc(s)+'">'+(borte?'Med igjen':'Borte')+'</button></td></tr>';
    });
    h+='</tbody></table><p class="cup-hint">Keepertid teller ikke som spilletid. Den som har stått i mål, får derfor mer tid ute senere. «Borte» tar spilleren ut av oppstilling og snitt.</p>';
    return h;
  }
  function innstillinger(n){
    return '<details><summary>Innstillinger for lag '+n+'</summary>'
      +'<label>Kamplengde, minutter<input type="number" min="5" max="60" step="1" data-a="lengde" value="'+L(n).lengde+'"></label>'
      +'<label>Bytt hvert, minutter (tomt gir '+(intervall(n)?mmss(Math.round(L(n).lengde/(tilgjengelige(n).length-1)*2)/2*60000):'ingen')+')<input type="number" min="1" max="20" step="0.5" data-a="intervall" value="'+(L(n).intervall||'')+'" placeholder="auto"></label>'
      +'<button type="button" class="fare" data-a="nullstillkamp">Nullstill denne kampen</button> '
      +'<button type="button" class="fare" data-a="nullstill">Nullstill hele dagen for lag '+n+'</button></details>';
  }

  function render(){
    avregnAlle();
    var v=lager.valg, h='<div class="cup-valg" role="group" aria-label="Velg lag">';
    ['1','2','3','alle'].forEach(function(x){
      h+='<button type="button" data-a="lag" data-v="'+x+'" aria-pressed="'+(v===x)+'">'+(x==='alle'?'Alle':'Lag '+x)+'</button>';
    });
    h+='</div>';
    if(v==='alle'){
      h+='<h2>Alle kamper, tre lag</h2>'+alleKamper();
      h+='<p class="cup-hint">Trykk en kamp for å åpne laget og spilletiden.</p>';
    }else{
      var n=+v, nt=nesteTekst(n), i=valgtKamp(n);
      h+='<div class="cup-neste"><b data-t="neste">'+esc(nt.b)+'</b><span data-t="neste-s">'+esc(nt.s)+'</span></div>';
      h+=spilletid(n,i);
      h+='<h2 id="kampene">Kampene til lag '+n+', pulje '+LAG[n].pulje+'</h2>'+kampliste(n,i);
      h+=dagen(n)+innstillinger(n);
    }
    app.innerHTML=h;
    lagre();
  }

  // Hvert sekund: bare tallene oppdateres, så trykk ikke går tapt
  function tikk(){
    avregnAlle();
    var v=lager.valg;
    if(v==='alle'){return;}
    var n=+v, i=valgtKamp(n), k=L(n).kamper[i];
    var nt=nesteTekst(n);
    var nb=app.querySelector('[data-t="neste"]'); if(nb) nb.textContent=nt.b;
    var ns=app.querySelector('[data-t="neste-s"]'); if(ns) ns.textContent=nt.s;
    if(!k) return;
    var gikk=app.querySelector('.hoved.pause');
    if(gikk&&!k.gaar){render();return;} // klokka nådde full tid
    if(!k.gaar) return;
    var snitt=snittTid(n);
    app.querySelectorAll('[data-t]').forEach(function(el){
      var t=el.getAttribute('data-t'), s=el.getAttribute('data-s');
      if(t==='klokke') el.textContent=mmss(k.klokke);
      else if(t==='siden') el.textContent=mmss(k.klokke-k.sisteBytte);
      else if(t==='k') el.textContent=mmss(k.tid[s]||0);
      else if(t==='kk') el.textContent=mmss(k.keeperTid[s]||0);
      else if(t==='d') el.textContent=mmss(sum(n,'tid',s));
      else if(t==='lenge') el.textContent=mmss(k.klokke-(k.inn[s]||0));
      else if(t==='avvik'){var av=sum(n,'tid',s)-snitt;el.textContent=avvikTekst(av);el.className=av>=0?'pluss':'minus';}
      else if(t==='forslag'){
        var f=forslag(n,k), boks=el.firstElementChild;
        var noekkel=f?f.inn+'|'+f.ut+'|'+f.na:'';
        if(!boks||boks.getAttribute('data-noekkel')!==noekkel){
          el.innerHTML=forslagHtml(n,k);
          var id=n+'-'+i+'-'+k.sisteBytte;
          if(f&&f.na&&!varslet[id]){varslet[id]=1;try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}
        }
      }
    });
    lagre();
  }

  app.addEventListener('click',function(e){
    var b=e.target.closest('[data-a]'); if(!b||b.tagName==='INPUT') return;
    var a=b.getAttribute('data-a'), v=lager.valg, n=+v, i=v==='alle'?0:valgtKamp(n), k;
    if(a==='lag'){lager.valg=b.getAttribute('data-v');merket=null;history.replaceState(null,'','?lag='+lager.valg);render();return;}
    if(a==='lagkamp'){lager.valg=b.getAttribute('data-n');L(+lager.valg).valgt=+b.getAttribute('data-i');merket=null;history.replaceState(null,'','?lag='+lager.valg);render();window.scrollTo(0,0);return;}
    if(a==='kamp'){L(n).valgt=+b.getAttribute('data-i');merket=null;render();document.getElementById('klokka').scrollIntoView({behavior:'smooth'});return;}
    k=kamp(n,i);
    var lengde=L(n).lengde*60000;
    if(a==='start'){
      // Bare én kamp kan gå om gangen per lag
      for(var j in L(n).kamper){var kj=L(n).kamper[j];if(kj!==k&&kj.gaar){avregn(kj,lengde);kj.gaar=false;}}
      k.gaar=true;k.ferdig=false;k.sist=Date.now();holdSkjerm();
    }
    else if(a==='pause'){avregn(k,lengde);k.gaar=false;slippSkjerm();}
    else if(a==='ferdig'){avregn(k,lengde);k.gaar=false;k.ferdig=true;slippSkjerm();
      for(var x=i+1;x<4;x++){if(!(L(n).kamper[x]&&L(n).kamper[x].ferdig)){L(n).valgt=x;break;}}}
    else if(a==='gjenapne'){k.ferdig=false;}
    else if(a==='forslag'){var f=forslag(n,k);if(f) bytt(n,k,f.inn,f.ut);merket=null;}
    else if(a==='spiller'){
      var s=b.getAttribute('data-s');
      if(merket===s) merket=null;
      else if(merket&&bytt(n,k,merket,s)) merket=null;
      else merket=s;
    }
    else if(a==='angre'&&k.angre){
      var g=k.angre;k.keeper=g.keeper;k.bane=g.bane;k.benk=g.benk;k.inn=g.inn;k.ut=g.ut;k.sisteBytte=g.sisteBytte;k.bytter=g.bytter;k.angre=null;
    }
    else if(a==='ute'){
      var sp=b.getAttribute('data-s'), l=L(n);
      if(l.ute[sp]){
        delete l.ute[sp];
        for(var y in l.kamper){var ky=l.kamper[y];if(!ky.ferdig&&!rolle(ky,sp)) settRolle(ky,sp,ky.bane.length<PAA_BANEN?'bane':'benk');}
      }else{
        l.ute[sp]=true;
        for(var z in l.kamper){
          var kz=l.kamper[z]; if(kz.ferdig) continue;
          avregn(kz,lengde);
          var r=rolle(kz,sp); fjern(kz,sp);
          if((r==='bane'||r==='keeper')&&kz.benk.length){
            var inn=kz.benk.slice().sort(function(p,q){return sum(n,'tid',p)-sum(n,'tid',q);})[0];
            fjern(kz,inn); settRolle(kz,inn,r);
          }
          kz.angre=null;
        }
      }
      if(merket===sp) merket=null;
    }
    else if(a==='nullstillkamp'){if(!confirm('Nullstille kamp '+(i+1)+'? Spilletiden i denne kampen slettes.')) return;delete L(n).kamper[i];merket=null;}
    else if(a==='nullstill'){if(!confirm('Nullstille hele dagen for lag '+n+'? All spilletid slettes.')) return;L(n).kamper={};L(n).valgt=null;L(n).ute={};merket=null;}
    render();
  });
  app.addEventListener('change',function(e){
    var el=e.target, a=el.getAttribute('data-a'), n=+lager.valg;
    if(a==='lengde'){var v=parseFloat(el.value);if(v>=5&&v<=60){avregnAlle();L(n).lengde=v;}}
    if(a==='intervall'){var w=parseFloat(el.value);L(n).intervall=(w>=1&&w<=20)?w:null;}
    render();
  });
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'){
      render();
      var v=lager.valg;
      if(v!=='alle'){var k=L(+v).kamper[valgtKamp(+v)];if(k&&k.gaar) holdSkjerm();}
    }
  });

  render();
  setInterval(tikk,1000);
})();
</script>
</body>
</html>
