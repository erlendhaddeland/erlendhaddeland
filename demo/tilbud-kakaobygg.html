:root{
  --blekk:#14161A;
  --grafitt:#565C66;
  --stille:#8A9099;
  --flate:#F0F1F3;
  --linje:#D3D7DC;
  --rod:#8A4B2F;
  --papir:#FFFFFF;
  --ui-flate:#F4F5F7;
  --ui-linje:#E2E5E9;
  --ui-kant:#C9CDD3;
  --ui-svak:#6B7280;
  --sans:"Barlow","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --mono:"Barlow","Segoe UI",system-ui,Arial,sans-serif;
}
*{box-sizing:border-box}
.poster td,.sumlinje .m,.total .sum,.opsjonsrad .pr,.termin td.sum2,.cover-fakta b,.tall b{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
html,body{margin:0;padding:0}
body{background:#D9DCE1;font-family:var(--sans);color:var(--blekk);-webkit-font-smoothing:antialiased;
  padding-top:60px;padding-right:0;transition:padding-right .18s}
body.skuff-apen{padding-right:400px}

/* ---------- arket ---------- */
.ark{
  position:relative;
  width:210mm;height:297mm;
  background:var(--papir);
  margin:10mm auto;
  padding:16mm 18mm 24mm 18mm;
  display:flex;flex-direction:column;
  overflow:hidden;
  box-shadow:0 3px 20px rgba(20,22,26,.20);
}
.ark.bleed{padding:0}
.innhold{flex:1;min-height:0;overflow:hidden}

/* ---------- tittelfelt ---------- */
.tittelfelt{
  position:absolute;left:18mm;right:18mm;bottom:10mm;
  border-top:1.4pt solid var(--rod);
  padding-top:2.5mm;
  display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1.2fr) auto;
  gap:5mm;align-items:start;
  font-family:var(--mono);font-size:6.6pt;letter-spacing:.06em;color:var(--stille);
  text-transform:uppercase;
}
.tittelfelt>div{min-width:0;overflow:hidden}
.tittelfelt b{display:block;color:var(--blekk);font-weight:600;letter-spacing:.02em;
  text-transform:none;font-size:7.4pt;margin-top:.6mm;line-height:1.25;
  overflow-wrap:anywhere;hyphens:auto}
.tittelfelt .h{text-align:right}
.ark.bleed .tittelfelt{left:16mm;right:16mm;border-top-color:rgba(255,255,255,.55);color:rgba(255,255,255,.72)}
.ark.bleed .tittelfelt b{color:#fff}

/* ---------- typografi ---------- */
.eyebrow{font-family:var(--mono);font-size:7.4pt;letter-spacing:.2em;text-transform:uppercase;color:var(--rod);margin:0 0 3mm}
.eyebrow.gra{color:var(--stille)}
h1{font-size:30pt;line-height:1.04;letter-spacing:-.02em;font-weight:700;margin:0 0 4mm}
h2{font-size:16pt;line-height:1.15;letter-spacing:-.01em;font-weight:700;margin:0 0 4mm}
h3{font-size:9.5pt;line-height:1.3;font-weight:700;margin:0 0 1.5mm}
p{font-size:10pt;line-height:1.62;margin:0 0 3.2mm;color:#22262C}
.lead{font-size:11.5pt;line-height:1.55}
.liten{font-size:8.6pt;line-height:1.5;color:var(--grafitt)}
strong{font-weight:650}

/* ---------- forside ---------- */
.cover-topp{position:absolute;top:16mm;left:16mm;right:16mm;display:flex;justify-content:space-between;align-items:flex-start;z-index:3}
.cover-topp .logoflate{background:#fff;padding:4.5mm 5.5mm;display:block;box-shadow:0 2mm 6mm rgba(0,0,0,.28)}
.cover-topp .logoflate img{width:36mm;height:auto;display:block}
/* logo rett paa bildet, uten hvit boks */
.cover-topp .logoflate.naken{background:none;padding:0;box-shadow:none}
.cover-topp .logoflate.naken img{width:38mm}
.cover-topp .logoflate.naken.lys img{filter:drop-shadow(0 .4mm 1.2mm rgba(0,0,0,.55))}
.cover-topp .logoflate.naken.mork img{filter:drop-shadow(0 .4mm 1.2mm rgba(255,255,255,.5))}
.merk{font-family:var(--mono);font-size:7pt;letter-spacing:.16em;text-transform:uppercase;color:#fff;text-align:right;line-height:1.9}
.cover-bilde{position:absolute;inset:0;z-index:1;background:#3B2A21}
.cover-bilde img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center}
.cover-slor{position:absolute;inset:0;z-index:2;
  background:linear-gradient(180deg,rgba(10,12,15,.55) 0%,rgba(10,12,15,.10) 26%,rgba(10,12,15,.08) 44%,rgba(10,12,15,.54) 76%,rgba(10,12,15,.70) 100%)}
.cover-tekst{position:absolute;left:16mm;right:16mm;bottom:26mm;z-index:3;color:#fff}
.cover-tekst h1{font-size:34pt;margin-bottom:5mm}
.cover-tekst .eyebrow{color:#fff;opacity:1;font-size:11pt;letter-spacing:.34em;margin-bottom:6mm}
.cover-tekst .lead{margin:0;color:rgba(255,255,255,.88);max-width:120mm}
.cover-fakta{display:flex;gap:14mm;border-top:.6pt solid rgba(255,255,255,.35);padding-top:4mm;margin-top:6mm}
.cover-fakta div{font-family:var(--mono);font-size:7pt;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.cover-fakta b{display:block;font-family:var(--sans);font-size:10.5pt;letter-spacing:0;text-transform:none;color:#fff;font-weight:600;margin-top:1.5mm}
.cover-tom{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:9pt;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.45)}

/* ---------- brev ---------- */
.brev{display:grid;grid-template-columns:1fr 52mm;gap:12mm}
.sidefelt{border-left:.6pt solid var(--linje);padding-left:6mm}
.sidefelt dt{font-family:var(--mono);font-size:6.8pt;letter-spacing:.14em;text-transform:uppercase;color:var(--stille);margin-top:5mm}
.sidefelt dd{margin:.8mm 0 0;font-size:9.4pt;font-weight:600;line-height:1.35}
.sidefelt dt:first-child{margin-top:0}
.signatur{display:flex;align-items:center;gap:5mm;margin-top:8mm;padding-top:5mm;border-top:.6pt solid var(--linje)}
.signatur img{width:40mm;height:50mm;object-fit:cover;object-position:center 18%;display:block;filter:grayscale(.15)}
.signatur .navn{font-size:11pt;font-weight:700}
.signatur .rolle{font-size:8.8pt;color:var(--grafitt);margin-top:.6mm}
.signatur .kontakt{font-family:var(--mono);font-size:8pt;color:var(--grafitt);margin-top:1.8mm}

/* ---------- innholdsblokker ---------- */
.blokk{border-top:.6pt solid var(--linje);padding-top:3.5mm;margin-bottom:5.5mm}
.blokk:last-child{margin-bottom:0}
.blokk .merkelapp{font-family:var(--mono);font-size:6.8pt;letter-spacing:.16em;text-transform:uppercase;color:var(--rod);margin-bottom:2mm}
.bildestripe{margin:0 0 6mm;position:relative}
.bildestripe img{width:100%;height:46mm;object-fit:cover;display:block}
.bildestripe figcaption{font-family:var(--mono);font-size:6.8pt;letter-spacing:.12em;text-transform:uppercase;color:var(--stille);margin-top:2mm}

/* ---------- lister ---------- */
.sjekk{list-style:none;margin:0;padding:0;column-count:2;column-gap:10mm}
.sjekk li{font-size:9.6pt;line-height:1.35;padding:1.6mm 0 1.6mm 6mm;border-bottom:.5pt solid var(--linje);position:relative;break-inside:avoid}
.sjekk li::before{content:"";position:absolute;left:0;top:2.9mm;width:2.6mm;height:2.6mm;background:var(--rod)}
.sjekk.ute li::before{background:none;border:.7pt solid var(--stille)}
.sjekk.ute li{color:var(--grafitt)}

/* ---------- pris ---------- */
.total{border-top:2.2pt solid var(--blekk);padding-top:4mm;margin-bottom:7mm}
.total .label{font-family:var(--mono);font-size:7.4pt;letter-spacing:.18em;text-transform:uppercase;color:var(--grafitt)}
.total .sum{font-size:23pt;line-height:1;font-weight:700;letter-spacing:-.02em;margin:2mm 0 1mm}
.total .under{font-size:9.4pt;color:var(--grafitt)}
.stolpe{display:flex;height:7mm;margin:6mm 0 2.5mm;overflow:hidden;background:var(--flate)}
.stolpe span{display:block;height:100%}
.stolpe-tekst{display:flex;flex-wrap:wrap;gap:8mm;font-family:var(--mono);font-size:7pt;letter-spacing:.1em;text-transform:uppercase;color:var(--grafitt)}
.stolpe-tekst i{display:inline-block;width:2.4mm;height:2.4mm;margin-right:1.6mm;font-style:normal}
.poster{width:100%;border-collapse:collapse;margin-top:6mm}
.poster th{font-family:var(--mono);font-size:6.8pt;letter-spacing:.14em;text-transform:uppercase;color:var(--stille);text-align:left;font-weight:400;padding-bottom:2mm;border-bottom:.6pt solid var(--linje)}
.poster th.t,.poster td.t{text-align:right}
.poster td{padding:3.2mm 0;border-bottom:.5pt solid var(--linje);font-size:10pt;vertical-align:top}
.poster .navn{font-weight:650}
.poster .beskr{font-size:8.4pt;color:var(--grafitt);margin-top:.8mm;line-height:1.4}
.poster tr.av .navn,.poster tr.av td{color:var(--stille)}
.poster tr.av .sum{text-decoration:line-through}
.valgt{font-family:var(--mono);font-size:6.6pt;letter-spacing:.12em;text-transform:uppercase;color:var(--rod);display:block;margin-top:1.2mm}
tr.av .valgt{color:var(--stille)}
.sumlinje{display:flex;justify-content:space-between;align-items:baseline;padding:3mm 0;font-size:10pt}
.sumlinje.stor{border-top:1.4pt solid var(--blekk);margin-top:2mm;font-size:13pt;font-weight:700}
.sumlinje .m{font-family:var(--mono)}
.viktig{background:var(--flate);border-left:2.2pt solid var(--rod);padding:5mm 6mm;margin-top:7mm}
.viktig h3{margin-bottom:1.5mm}
.viktig p{margin:0;font-size:9.4pt;line-height:1.55}
.opsjonsboks{border-top:1.4pt solid var(--blekk);padding-top:4mm;margin-top:7mm}
.opsjonsboks .merkelapp{font-family:var(--mono);font-size:6.8pt;letter-spacing:.16em;text-transform:uppercase;color:var(--rod);margin-bottom:2mm}
.opsjonsrad{display:flex;justify-content:space-between;gap:8mm;padding:2.6mm 0;border-bottom:.5pt solid var(--linje);font-size:9.6pt}
.opsjonsrad .b{font-size:8.4pt;color:var(--grafitt);margin-top:.6mm;line-height:1.4}
.opsjonsrad .pr{font-family:var(--mono);white-space:nowrap;font-weight:650}

/* ---------- kontrakt: parter, betaling, signatur ---------- */
.parter{display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin-bottom:8mm}
.parter .part{border-top:1.4pt solid var(--blekk);padding-top:3.5mm}
.parter .rolle2{font-family:var(--mono);font-size:6.8pt;letter-spacing:.16em;
  text-transform:uppercase;color:var(--rod);margin-bottom:2mm}
.parter .navn2{font-size:12pt;font-weight:700;letter-spacing:-.01em;margin-bottom:1.5mm}
.parter .linje2{font-size:9.4pt;line-height:1.55;color:#22262C}

.termin{width:100%;border-collapse:collapse;margin-top:5mm}
.termin th{font-family:var(--mono);font-size:6.8pt;letter-spacing:.14em;text-transform:uppercase;
  color:var(--stille);text-align:left;font-weight:400;padding-bottom:2mm;border-bottom:.6pt solid var(--linje)}
.termin th.t,.termin td.t{text-align:right}
.termin td{padding:3.4mm 0;border-bottom:.5pt solid var(--linje);font-size:10pt;vertical-align:top}
.termin td.nr{font-family:var(--mono);font-size:8pt;color:var(--stille);width:12mm}
.termin .navn3{font-weight:650}
.termin .nar{font-size:8.6pt;color:var(--grafitt);margin-top:.8mm;line-height:1.4}
.termin td.sum2{font-family:var(--mono);white-space:nowrap;font-weight:650}
.termin tr.sumrad td{border-bottom:0;border-top:1.4pt solid var(--blekk);font-weight:700;font-size:11.5pt;padding-top:3.5mm}

.frister{display:grid;grid-template-columns:repeat(3,1fr);gap:8mm;
  border-top:1.4pt solid var(--blekk);padding-top:3.5mm;margin-bottom:8mm}
.frister>div .k2{font-family:var(--mono);font-size:6.8pt;letter-spacing:.14em;
  text-transform:uppercase;color:var(--stille);margin-bottom:1.5mm}
.frister>div .v2{font-size:10.5pt;font-weight:650;line-height:1.35}

.signfelt{display:grid;grid-template-columns:1fr 1fr;gap:14mm;margin-top:auto;padding-top:6mm}
.signfelt>div{border-top:.6pt solid var(--linje);padding-top:2.5mm}
.signfelt .strek2{border-bottom:.8pt solid var(--blekk);height:22mm}
.signfelt .navn4{font-family:var(--mono);font-size:6.8pt;letter-spacing:.14em;
  text-transform:uppercase;color:var(--stille);margin-top:2.5mm}
.signfelt .under2{font-size:9.4pt;font-weight:650;margin-top:1mm}

/* ---------- romskjema ---------- */
.rom{width:100%;border-collapse:collapse;table-layout:fixed}
.rom th{font-family:var(--mono);font-size:6.4pt;letter-spacing:.12em;text-transform:uppercase;color:var(--stille);text-align:left;font-weight:400;padding:0 2.4mm 2mm 0;border-bottom:.6pt solid var(--blekk)}
.rom td{padding:2.2mm 2.4mm 2.2mm 0;border-bottom:.5pt solid var(--linje);font-size:8.4pt;
  line-height:1.32;vertical-align:top;overflow:hidden;overflow-wrap:anywhere;word-break:break-word}
.rom td:first-child{font-weight:650}
.rom td [contenteditable],.produkt td [contenteditable]{
  display:block;max-width:100%;min-height:1.32em;
  overflow-wrap:anywhere;word-break:break-word;hyphens:auto}
.rom td [contenteditable]:empty::before,.produkt td [contenteditable]:empty::before{content:"\00B7\00B7\00B7";color:var(--linje);letter-spacing:.1em}
@media print{.rom td [contenteditable]:empty::before,.produkt td [contenteditable]:empty::before{content:""}}
.rom tr.gruppe td{background:var(--flate);font-family:var(--mono);font-size:6.8pt;letter-spacing:.16em;text-transform:uppercase;color:var(--grafitt);padding:1.8mm 3mm;font-weight:400}
.produkt{width:100%;border-collapse:collapse;margin-top:7mm}
.produkt{table-layout:fixed}
.produkt td{padding:2.4mm 4mm 2.4mm 0;border-bottom:.5pt solid var(--linje);font-size:8.8pt;
  line-height:1.4;width:29%;vertical-align:top;color:#22262C;
  overflow:hidden;overflow-wrap:anywhere}
.produkt td.k{font-family:var(--sans);font-size:8.8pt;font-weight:700;letter-spacing:-.005em;
  text-transform:none;color:var(--blekk);width:21%}

/* ---------- veien videre ---------- */
.qa{border-top:.6pt solid var(--linje);padding-top:3mm;margin-bottom:4.5mm}
.qa h3{font-size:10pt;margin-bottom:1.4mm}
.qa p{font-size:9.4pt;margin:0;line-height:1.55}
.trinn{display:grid;grid-template-columns:repeat(3,1fr);gap:6mm 7mm;margin-bottom:7mm}
.trinn>div{border-top:1.4pt solid var(--blekk);padding-top:2.5mm}
.trinn .nr{font-family:var(--mono);font-size:6.8pt;letter-spacing:.14em;color:var(--rod);margin-bottom:1.5mm}
.trinn h3{font-size:9.4pt}
.trinn p{font-size:8.4pt;line-height:1.45;color:var(--grafitt);margin:0}

/* ---------- hvem som bygger ---------- */
.omoss{column-count:2;column-gap:11mm;margin-bottom:8mm}
.omoss p{font-size:10pt;line-height:1.62;margin:0 0 3.4mm}
.tall{display:grid;grid-template-columns:repeat(4,1fr);gap:6mm;border-top:1.4pt solid var(--blekk);padding-top:3.5mm}
.tall>div{font-family:var(--mono);font-size:6.8pt;letter-spacing:.13em;text-transform:uppercase;color:var(--grafitt);line-height:1.5}
.tall b{display:block;font-family:var(--sans);font-size:19pt;letter-spacing:-.02em;color:var(--blekk);text-transform:none;margin-bottom:1mm}
.avslutt{margin-top:auto;border-top:1.4pt solid var(--blekk);padding-top:4.5mm;
  display:flex;justify-content:space-between;align-items:flex-end;gap:10mm}
.avslutt .firma{font-size:8.6pt;line-height:1.55;color:var(--grafitt)}
.avslutt .firma .fnavn{font-size:10pt;font-weight:700;color:var(--blekk);margin-bottom:.8mm}
.avslutt .firma .utfort{margin-top:1.6mm;font-family:var(--mono);font-size:7pt;letter-spacing:.06em;color:var(--stille)}
.avslutt img{width:34mm;height:auto;display:block;flex:none}

/* ---------- avslutningsside ---------- */
.ark.natt{background:#0E1013;color:#fff;padding:0}
.natt .innhold{padding:26mm 22mm 0;display:flex;flex-direction:column;height:100%}
.natt .eyebrow{color:#fff;opacity:.55;letter-spacing:.3em}
.natt h1{font-size:38pt;line-height:1.02;letter-spacing:-.025em;margin:0;max-width:150mm}
.natt .strek{width:26mm;height:1.6pt;background:var(--rod);margin:9mm 0 8mm}
.natt .lead{font-size:12.5pt;line-height:1.6;color:rgba(255,255,255,.74);max-width:118mm;margin:0}
.natt .kort{margin-top:auto;display:grid;grid-template-columns:auto 1fr auto;gap:9mm;
  align-items:end;border-top:.6pt solid rgba(255,255,255,.22);padding:7mm 0 0}
.natt .kort img.portrett{width:26mm;height:32mm;object-fit:cover;object-position:center 16%;
  display:block;filter:grayscale(.2) contrast(1.04)}
.natt .kort .navn{font-size:13pt;font-weight:700;letter-spacing:-.01em}
.natt .kort .rolle{font-size:9pt;color:rgba(255,255,255,.6);margin-top:1mm}
.natt .kort .kontakt{font-family:var(--mono);font-size:8.6pt;color:rgba(255,255,255,.9);margin-top:3mm;line-height:1.7}
.natt .kort .logoflate{background:#fff;padding:4mm 5mm;display:block}
.natt .kort .logoflate img{width:32mm;height:auto;display:block}
.natt .bunn{border-top:.6pt solid rgba(255,255,255,.16);margin-top:6mm;padding:4mm 0 9mm;
  font-family:var(--mono);font-size:7pt;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.45);display:grid;grid-template-columns:auto auto auto;
  gap:2mm 9mm;justify-content:start}
.ark.natt .stempel span{color:rgba(255,255,255,.13)}
.ark.natt>.tittelfelt{display:none}

/* ---------- utkaststempel ---------- */
.stempel{position:absolute;inset:0;z-index:20;pointer-events:none;display:none;
  align-items:center;justify-content:center;overflow:hidden}
body.utkast .stempel{display:flex}
.ark.bleed .stempel span{color:rgba(255,255,255,.22)}
.stempel span{font-family:var(--mono);font-size:64pt;letter-spacing:.28em;font-weight:700;
  color:rgba(226,35,26,.10);transform:rotate(-28deg);white-space:nowrap;text-transform:uppercase}

/* ---------- overflytsvarsel (kun skjerm) ---------- */
.ark.flyter{outline:2px solid var(--rod);outline-offset:3px}
.flytmerke{position:absolute;top:0;right:0;z-index:30;background:var(--rod);color:#fff;
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;display:none}
.ark.flyter .flytmerke{display:block}

/* ---------- toppbar ---------- */
.topp{position:fixed;top:0;left:0;right:0;z-index:120;
  background:#fff;color:var(--blekk);
  display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap;
  border-bottom:1px solid var(--ui-linje);
  box-shadow:0 1px 10px rgba(20,22,26,.09)}
.topp .bytter{display:inline-flex;border:1px solid var(--ui-kant);border-radius:4px;overflow:hidden;margin-right:12px}
.topp .bytter button{border:0;border-radius:0;padding:11px 20px;background:#fff;
  color:var(--ui-svak);font-size:13.5px;font-weight:600}
.topp .bytter button + button{border-left:1px solid var(--ui-kant)}
.topp .bytter button:hover{background:var(--ui-flate);color:var(--blekk)}
.topp .bytter button[aria-pressed="true"]{background:var(--blekk);color:#fff}
.topp .tit{margin-right:auto;font-family:var(--mono);font-size:12px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--blekk)}
.topp .tit s{color:var(--rod);text-decoration:none}
.topp .status{font-size:13px;color:var(--ui-svak);margin-right:14px}
.topp .status.klar{color:#1E8E3E;font-weight:600}
.topp .status.varsel{color:var(--rod);font-weight:600}
button{font:inherit;cursor:pointer}
.topp button{
  background:#fff;color:var(--blekk);border:1px solid var(--ui-kant);
  padding:11px 18px;border-radius:4px;
  font-family:var(--sans);font-size:13.5px;font-weight:600;letter-spacing:0;
  transition:background .12s,border-color .12s}
.topp button:hover{background:var(--ui-flate);border-color:#A8AEB6}
.topp button[aria-pressed="true"]{background:var(--blekk);border-color:var(--blekk);color:#fff}
.topp button.primar{background:var(--rod);border-color:var(--rod);color:#fff}
.topp button.primar:hover{background:#C31C14;border-color:#C31C14}
.topp :focus-visible{outline:2px solid var(--rod);outline-offset:2px}

/* ---------- skuff ---------- */
.skuff{position:fixed;top:60px;right:0;bottom:0;width:400px;z-index:110;
  background:var(--ui-flate);color:var(--blekk);overflow-y:auto;transform:translateX(100%);
  transition:transform .18s;font-size:13.5px;line-height:1.5;
  border-left:1px solid var(--ui-linje);box-shadow:-3px 0 18px rgba(20,22,26,.13)}
body.skuff-apen .skuff{transform:translateX(0)}

/* fremdrift */
.fremdrift{position:sticky;top:0;z-index:5;background:#fff;
  border-bottom:1px solid var(--ui-linje);padding:16px 18px 15px}
.fremdrift .tall{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.fremdrift .tall b{font-size:23px;font-weight:700;letter-spacing:-.02em;color:var(--blekk);line-height:1}
.fremdrift .tall span{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ui-svak)}
.fremdrift .stang{display:flex;gap:3px;margin-bottom:13px}
.fremdrift .stang i{flex:1;height:6px;border-radius:2px;background:#DFE3E8}
.fremdrift .stang i.ok{background:#1E8E3E}
.fremdrift .stang i.side{background:#B4BAC2}
.fremdrift ul{list-style:none;margin:0;padding:0}
.fremdrift li{display:grid;grid-template-columns:17px 1fr auto;gap:9px;align-items:start;
  padding:9px 0;border-top:1px solid var(--ui-linje);font-size:13.5px;line-height:1.4}
.fremdrift li .ikon{font-size:14px;line-height:1.2;color:var(--rod)}
.fremdrift li.ok .ikon{color:#1E8E3E}
.fremdrift li.side .ikon{color:#9AA1AA}
.fremdrift li.ok,.fremdrift li.side{color:#8A9099}
.fremdrift li .hjelp2{display:block;font-size:12px;color:var(--ui-svak);margin-top:3px;line-height:1.4}
.fremdrift li .handling{display:flex;gap:5px}
.fremdrift li button{background:#fff;border:1px solid var(--ui-kant);color:var(--blekk);
  border-radius:3px;font-family:var(--sans);font-size:11.5px;font-weight:600;
  padding:6px 9px;white-space:nowrap}
.fremdrift li button:hover{background:var(--ui-flate);border-color:#A8AEB6}
.fremdrift .ferdig{font-size:13.5px;color:#1E8E3E;padding:7px 0 3px;line-height:1.45;font-weight:600}
.fremdrift .flyt{margin-top:11px;font-size:12.5px;color:#93241E;border-left:3px solid var(--rod);
  padding:8px 0 8px 11px;background:#FDECEA;line-height:1.45}
.fremdrift .vis-alle{background:none;border:0;color:var(--ui-svak);
  font-family:var(--sans);font-size:12.5px;font-weight:600;padding:10px 0 0;text-decoration:underline}
.fremdrift .vis-alle:hover{color:var(--blekk)}

/* grupper */
.skuff .gruppe{border-bottom:1px solid var(--ui-linje);background:#fff}
.skuff .hode{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;color:var(--blekk);padding:15px 18px;
  font-family:var(--sans);font-size:14px;font-weight:650;letter-spacing:0}
.skuff .hode:hover{background:var(--ui-flate)}
.skuff .hode .pil{margin-left:auto;color:#9AA1AA;font-size:11px}
.skuff .hode .pip{width:8px;height:8px;border-radius:50%;background:#C9CDD3;flex:none}
.skuff .hode .pip.ok{background:#1E8E3E}
.skuff .hode .pip.na{background:#9AA1AA}
.skuff .krop{display:none;padding:2px 18px 20px}
.skuff .gruppe.apen .krop{display:block}
.skuff label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ui-svak);margin:14px 0 5px}
.skuff input[type=text],.skuff input[type=number],.skuff textarea,.skuff select{
  width:100%;background:#fff;border:1px solid var(--ui-kant);color:var(--blekk);
  padding:9px 11px;border-radius:3px;font:inherit;font-size:13.5px}
.skuff textarea{resize:vertical;min-height:66px;line-height:1.45}
.skuff input:focus,.skuff textarea:focus,.skuff select:focus{outline:none;
  border-color:var(--rod);box-shadow:0 0 0 3px rgba(226,35,26,.12)}
.skuff .knapp{background:#fff;border:1px solid var(--ui-kant);color:var(--blekk);
  padding:9px 14px;border-radius:3px;font-family:var(--sans);font-size:12.5px;
  font-weight:600;letter-spacing:0;margin:9px 7px 0 0}
.skuff .knapp:hover{background:var(--ui-flate);border-color:#A8AEB6}
.skuff .knapp.fare{color:var(--rod)}
.skuff .knapp.fare:hover{border-color:var(--rod);background:#FDECEA}
.skuff .rad{border:1px solid var(--ui-linje);border-radius:4px;padding:11px 13px;
  margin-top:12px;background:var(--ui-flate)}
.skuff .rad .topplinje{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.skuff .rad .topplinje .nr{font-family:var(--mono);font-size:10px;color:var(--ui-svak);letter-spacing:.1em}
.skuff .rad .topplinje .verkt{margin-left:auto;display:flex;gap:5px}
.skuff .mini{background:#fff;border:1px solid var(--ui-kant);color:var(--ui-svak);
  width:28px;height:26px;border-radius:3px;font-size:13px;line-height:1;padding:0}
.skuff .mini:hover{color:var(--blekk);border-color:#A8AEB6;background:var(--ui-flate)}
.skuff .hjelp{font-size:12.5px;color:var(--ui-svak);line-height:1.5;margin:9px 0 0}
.skuff .advarsel{font-size:12.5px;color:#93241E;line-height:1.5;
  border-left:3px solid var(--rod);padding:9px 0 9px 11px;margin:12px 0 0;background:#FDECEA}
.skuff .valgrad{display:flex;gap:6px;margin-top:6px}
.skuff .valgrad button{flex:1;background:#fff;border:1px solid var(--ui-kant);color:var(--blekk);
  padding:10px 6px;border-radius:3px;font-family:var(--sans);font-size:12.5px;font-weight:600}
.skuff .valgrad button:hover{background:var(--ui-flate)}
.skuff .valgrad button[aria-pressed="true"]{background:var(--blekk);color:#fff;border-color:var(--blekk)}
.skuff .omfangsrad{display:grid;grid-template-columns:1fr 150px;gap:9px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--ui-linje)}
.skuff .omfangsrad .tri{display:flex;gap:4px}
.skuff .omfangsrad .tri button{width:46px;background:#fff;border:1px solid var(--ui-kant);
  color:var(--blekk);padding:7px 0;border-radius:3px;font-family:var(--sans);font-size:11.5px;font-weight:600}
.skuff .omfangsrad .tri button:hover{background:var(--ui-flate)}
.skuff .omfangsrad .tri button[aria-pressed="true"]{background:var(--blekk);color:#fff;border-color:var(--blekk)}
.skuff .omfangsrad input{background:#fff;border:1px solid transparent;color:var(--blekk);
  padding:5px 6px;font-size:13.5px;width:100%;border-radius:3px}
.skuff .omfangsrad input:focus{outline:none;border-color:var(--rod);box-shadow:none}
.skuff .kolrad{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--blekk)}
.skuff .kolrad label{display:flex;align-items:center;gap:6px;margin:0;font-family:var(--sans);
  font-size:13px;letter-spacing:0;text-transform:none;color:var(--blekk)}
.skuff .romrad input{margin-bottom:6px}
.skuff .filflate{border:1px dashed var(--ui-kant);border-radius:3px;padding:14px;text-align:center;
  color:var(--ui-svak);font-size:12.5px;margin-top:8px;background:#fff}
.skuff .miniatyr{width:100%;height:78px;object-fit:cover;display:block;margin-top:9px;
  border:1px solid var(--ui-linje);border-radius:3px}
.skuff input[type=range]{width:100%;accent-color:var(--rod)}

/* ---------- vindu for PDF-utsnitt ---------- */
.modal{position:fixed;inset:0;z-index:200;background:rgba(20,22,26,.72);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;
  font-family:var(--sans);font-size:13px;color:#fff}
body.modal-apen .modal{display:flex}
.modal .ramme{position:relative;background:#fff;max-width:92vw;max-height:70vh;overflow:hidden;line-height:0}
.modal canvas{display:block;max-width:92vw;max-height:70vh;width:auto;height:auto;cursor:crosshair}
.modal .utsnitt{position:absolute;border:2px solid var(--rod);background:rgba(226,35,26,.14);pointer-events:none}
.modal .linje{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.modal button{background:#fff;border:1px solid var(--ui-kant);color:var(--blekk);
  padding:10px 16px;border-radius:4px;font:inherit;font-size:13.5px;font-weight:600}
.modal button:hover{background:var(--ui-flate)}
.modal button.primar{background:var(--rod);border-color:var(--rod);color:#fff}
.modal button:disabled{opacity:.45;cursor:default}
.modal .beskjed{max-width:520px;text-align:center;line-height:1.5;color:#fff}

[contenteditable="true"]:focus{outline:1px dashed var(--rod);outline-offset:3px}
body.vis-felt [contenteditable="true"]:hover{background:rgba(226,35,26,.05)}
.flytmerke{border-radius:0 0 0 3px}
.av-skjul{display:none !important}

@media print{
  body{background:#fff;padding:0 !important}
  .topp,.skuff,.flytmerke{display:none !important}
  .ark{margin:0;box-shadow:none;outline:none !important;page-break-after:always;break-after:page}
  .ark:last-child{page-break-after:auto;break-after:auto}
  [contenteditable="true"]{outline:none !important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@page{size:A4 portrait;margin:0}
</style>

function q(s,r){ return (r||document).querySelector(s); }
function qa(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}
function nl(s){ return esc(s).replace(/\n/g,"<br>"); }
/* «01. september» ser rart ut i versaler paa forsiden. */
function datoTekst(v){
  return String(v == null ? "" : v).replace(/^0(?=[1-9])/, "");
}
function kr(n){
  n = Number(n)||0;
  return Math.round(n).toLocaleString("nb-NO").replace(/[\u00A0\u202F]/g," ");
}
function talltil(v){
  return Number(String(v).replace(/[^0-9,.-]/g,"").replace(/\s/g,"").replace(",","."))||0;
}
/* Setter D.a.b.c = verdi ut fra en punktsti. */
function sett(sti,verdi){
  var d = sti.split("."), o = D;
  for(var i=0;i<d.length-1;i++){ o = o[d[i]]; }
  o[d[d.length-1]] = verdi;
}
function hent(sti){
  var d = sti.split("."), o = D;
  for(var i=0;i<d.length;i++){ if(o==null) return ""; o = o[d[i]]; }
  return o==null ? "" : o;
}
/* Redigerbart felt i dokumentet. */
function red(sti, tag, klasse, flerlinje){
  var v = hent(sti);
  return "<"+tag+(klasse?' class="'+klasse+'"':"")+
    ' contenteditable="true" spellcheck="false" data-bind="'+esc(sti)+'"'+
    (flerlinje?' data-fler="1"':"")+">"+
    (flerlinje?nl(v):esc(v))+"</"+tag+">";
}

  return D.pris.rader.reduce(function(s,r){ return s + (r.pa ? talltil(r.belop) : 0); }, 0);
}
/* ============================================================
   HVA MANGLER

   Sjekkes automatisk mot innholdet, i stedet for at noen skal
   huske aa hake av. Punkter kan settes til side, og teller da
   som gjort.
   ============================================================ */
function sjekkliste(){
  var liste = [];
  function p(id, gruppe, tekst, ok, hjelp){
    liste.push({id:id, gruppe:gruppe, tekst:tekst, ok:!!ok, hjelp:hjelp||"",
                sattTilSide: !!D.hoppOver[id]});
  }
  var a = AVSENDERE[D.avsender];

  p("logo","side1","Logo for "+a.navn, !!a.logo,
    "Forsiden viser firmanavnet i tekst så lenge logoen mangler.");
  p("bilde","side1","Forsidebilde", !!D.forside.bilde,
    "Last opp et bilde av bygget eller tomten.");
  p("person","side1","Avsender er valgt", !!(D.pros.ansvarlig && D.pros.tlf && D.pros.epost));
  p("kunde","kunde","Kundens navn", !!String(D.pros.kunde||"").trim());
  p("prosjekt","kunde","Prosjektnavn", !!String(D.pros.prosjekt||"").trim());
  p("dato","kunde","Dato og gyldighet", !!(String(D.pros.dato||"").trim() && String(D.pros.gyldig||"").trim()));

  var tomme = 0;
  D.seksjoner.forEach(function(s){
    s.blokker.forEach(function(b){ if(!String(b.t||"").trim()) tomme++; });
  });
  p("beskriv","beskriv","Beskrivelse utvendig og innvendig",
    D.seksjoner.every(function(s){ return s.blokker.length; }) && tomme === 0,
    tomme ? tomme+" blokk"+(tomme>1?"er":"")+" mangler tekst." : "Hent standardtekst for kategorien.");

  p("omfang","omfang","Hva som er med og ikke med",
    D.omfang.filter(function(o){ return o.s === "med"; }).length > 0);
  p("pris","pris","Pris", sumEks() > 0, "Ingen av prisblokkene har beløp.");
  p("rom","rom","Romskjema", D.rom.rader.length > 0, "Last opp Excel-filen med romskjemaet.");
  p("produkt","rom","Produkter og leverandører", D.produkt.rader.length > 0,
    "Ligger i ark 2 i Excel-filen.");
  p("vedlegg","vedlegg","Vedleggsliste",
    D.vedlegg.rader.filter(function(v){ return String(v.navn||"").trim(); }).length > 0);

  if(DOK === "kontrakt"){
    var k = D.kontrakt;
    p("forbruker","kontrakt","Forbrukerens navn og adresse",
      !!(String(k.forbruker.navn||"").trim() && String(k.forbruker.adresse||"").trim()),
      "Begge parter må stå i avtalen.");
    var sa = k.betaling.rader.reduce(function(s,r){ return s + (Number(r.andel)||0); }, 0);
    p("betaling","kontrakt","Betalingsplanen summerer til 100 prosent",
      Math.abs(sa - 100) <= 0.5, "Terminene summerer til " + sa + " prosent nå.");
    p("frister","kontrakt","Frister for oppstart og ferdigstillelse",
      !!(String(k.frister.oppstart||"").trim() && String(k.frister.ferdig||"").trim()));
  }

  return liste;
}
function gjenstaar(){
  return sjekkliste().filter(function(s){ return !s.ok && !s.sattTilSide; });
}
function apneSteg(){ return gjenstaar(); }

/* ============================================================
   LOGO PAA FORSIDEN

   Uten hvit boks maa logoen leses mot bildet under. Vi maaler hvor
   lyst bildet er der logoen ligger, og bytter til en hvit versjon
   naar bakgrunnen er moerk. Brukeren kan overstyre.
   ============================================================ */
function bakgrunnErMork(){
  var l = D.forside.toppLys;
  if(l === null || l === undefined) return true;   // uten maaling: anta morkt, sloret er kraftig oppe
  // sloret legger ca 50 prosent svart over toppen av bildet
  return (l * 0.5 + 10) < 132;
}

function logoStilNa(){
  var s = D.forside.logostil;
  if(!s || typeof s === "string") return s || "auto";
  return s[D.avsender] || "auto";
}

function logoPaaForside(a){
  var stil = logoStilNa();
  if(stil === "boks"){
    return '<div class="logoflate"><img src="'+a.logo+'" alt="'+esc(a.navn)+'"></div>';
  }
  var mork = (stil === "auto") ? bakgrunnErMork() : (stil === "hvit");
  var kilde = (mork && a.logoHvit) ? a.logoHvit : a.logo;
  return '<div class="logoflate naken '+(mork ? "mork" : "lys")+'">'+
    '<img src="'+kilde+'" alt="'+esc(a.navn)+'"></div>';
}

function arkForside(){
  var a = AVSENDERE[D.avsender];
  var z = (Number(D.forside.zoom) || 100) / 100;
  var stil = 'object-position:' + (Number(D.forside.posX)||50) + '% ' +
             (Number(D.forside.posY)||50) + '%;transform:scale(' + z.toFixed(3) + ')';
  var bilde = D.forside.bilde
    ? '<div class="cover-bilde"><img src="'+D.forside.bilde+'" alt="" style="'+stil+'"></div>'
    : '<div class="cover-bilde"><div class="cover-tom">Forsidebilde mangler</div></div>';
  var logo = a.logo ? logoPaaForside(a) :
    '<div class="logoflate" style="padding:6mm 7mm"><div style="font-family:var(--mono);font-size:8pt;letter-spacing:.1em;color:#8A9099">Logo mangler<br><b style="color:#14161A;font-size:9pt">'+esc(a.navn)+'</b></div></div>';
  return ark(
    bilde+

      red("forside.tittel","h1","",true)+

function arkSeksjon(si){
  var s = D.seksjoner[si];
  var sider = [[]], n = 0;

    if(b.sideskift && sider[n].length){ sider.push([]); n++; }
    sider[n].push(bi);
  });
  return sider.map(function(liste, pi){
    var bilde = (pi===0 && s.bilde)
      ? '<figure class="bildestripe"><img src="'+s.bilde+'" alt="">'+
        red("seksjoner."+si+".bildetekst","figcaption","")+'</figure>'
      : "";
    var blokker = liste.map(function(bi){
      var b = s.blokker[bi];
      return '<div class="blokk">'+
        red("seksjoner."+si+".blokker."+bi+".m","div","merkelapp")+
        red("seksjoner."+si+".blokker."+bi+".t","p","",true)+
        (b.liten ? red("seksjoner."+si+".blokker."+bi+".liten","p","liten",true) : "")+

    var tittel = pi===0

    return ark('<div class="innhold">'+eyebrow+tittel+bilde+blokker+'</div>');

}

  if(k.himling) kol.push({f:"himling",n:"Himling",b:13});
  if(k.elektro) kol.push({f:"elektro",n:"Elektriker",b:12});
  if(k.ror)     kol.push({f:"ror",n:"Rørlegger",b:13});
  if(k.annet)   kol.push({f:"annet",n:"Annet",b:23});

/* ============================================================
   KONTRAKTSSIDE

   Alt som skiller en kontrakt fra et tilbud staar paa én side:
   partene, fristene, betalingsplanen og signaturfeltene.
   ============================================================ */
/* Siste termin er alltid resten. Da kan planen ikke summere til
   noe annet enn 100 prosent og hele kontraktssummen. */
function terminOppsett(grunnlag){
  var r = D.kontrakt.betaling.rader, n = r.length;
  var andeler = r.map(function(x){ return Number(x.andel) || 0; });
  var belop = [];
  if(n === 0) return {andeler:[], belop:[], rest:100, forMye:false};

  var sumAndre = 0;
  for(var i = 0; i < n - 1; i++){ sumAndre += andeler[i]; }
  var rest = Math.round((100 - sumAndre) * 100) / 100;
  andeler[n-1] = rest;

  var sumBelop = 0;
  for(var j = 0; j < n - 1; j++){
    belop[j] = Math.round(grunnlag * andeler[j] / 100);
    sumBelop += belop[j];
  }
  // siste termin tar ogsaa avrundingen, slik at summen blir eksakt
  belop[n-1] = Math.round(grunnlag) - sumBelop;

  return {andeler:andeler, belop:belop, rest:rest, forMye:rest < -0.005};
}

function arkAvtale(){
  if(DOK !== "kontrakt") return "";
  var k = D.kontrakt, eks = sumEks();
  var privat = D.pris.mva === "privat";
  var grunnlag = privat ? eks * 1.25 : eks;
  var a = AVSENDERE[D.avsender], b1 = AVSENDERE.kakaobygg;

  var opp = terminOppsett(grunnlag);
  var rader = k.betaling.rader.map(function(r,i){
    var neg = opp.andeler[i] < 0;
    return "<tr"+(neg ? ' style="color:var(--rod)"' : "")+">"+
      '<td class="nr">'+(i+1)+"</td>"+
      "<td>"+red("kontrakt.betaling.rader."+i+".navn","span","navn3")+
        red("kontrakt.betaling.rader."+i+".nar","div","nar",true)+"</td>"+
      '<td class="t">'+opp.andeler[i]+" %</td>"+
      '<td class="t sum2">'+kr(opp.belop[i])+"</td></tr>";
  }).join("");

  var avvik = opp.forMye
    ? '<p class="liten" style="color:var(--rod);margin-top:2mm">Terminene over den siste summerer til mer enn 100 prosent. Sett ned en av dem, så retter siste termin seg selv.</p>'
    : "";

  return ark('<div class="innhold" style="display:flex;flex-direction:column;height:100%">'+
    '<p class="eyebrow">Avtalen</p><h2>Parter og betaling</h2>'+
    red("kontrakt.hoveddel","p","liten",true)+

    '<div class="parter" style="margin-top:5mm">'+
      '<div class="part"><div class="rolle2">Entreprenør</div>'+
        '<div class="navn2">'+esc(a.navn)+'</div>'+
        '<div class="linje2">'+esc(a.adresse)+'<br>Org.nr. '+esc(a.orgnr)+
        '<br>'+esc(D.pros.ansvarlig)+', '+esc(D.pros.tlf)+
        (D.avsender !== "kakaobygg" ? '<br>Arbeidet utføres av '+esc(b1.navn) : "")+
        '</div></div>'+
      '<div class="part"><div class="rolle2">Forbruker</div>'+
        red("kontrakt.forbruker.navn","div","navn2")+
        '<div class="linje2">'+
          red("kontrakt.forbruker.adresse","span","")+'<br>'+
          red("kontrakt.forbruker.tlf","span","")+' &nbsp;/&nbsp; '+
          red("kontrakt.forbruker.epost","span","")+
        '</div></div>'+
    '</div>'+

function nyttArk(innhold){
  var a = document.createElement("section");
  a.className = "ark";
  a.innerHTML =
    '<div class="flytmerke">Teksten går ut over siden</div>'+
    '<div class="stempel"><span>Utkast</span></div>'+
    innhold+
    '<div class="tittelfelt"></div>';
  return a;
}
function settInnEtter(innhold, nyttArket){
  innhold.parentNode.parentNode.insertBefore(nyttArket, innhold.parentNode.nextSibling);
}

/* Opsjonene flyttes til egen side naar prissiden er full, og deles
   videre hvis de blir mange. Da kan man legge til saa mange man vil. */
function delPrisside(){
  var pris = q("[data-prisside]");
  if(!pris) return;

  var boks = q(".opsjonsboks", pris);
  if(boks && pris.scrollHeight - pris.clientHeight > 2){
    var ark = nyttArk('<div class="innhold" data-opsjonsside="1">'+
      '<p class="eyebrow">'+ORD("Pris","Kontraktssum")+'</p><h2>Opsjoner</h2></div>');
    var maal = q(".innhold", ark);
    boks.style.borderTop = "0";
    boks.style.paddingTop = "0";
    boks.style.marginTop = "0";
    var lapp = q(".merkelapp", boks);
    if(lapp) lapp.parentNode.removeChild(lapp);
    maal.appendChild(boks);
    settInnEtter(pris, ark);
  }

  var vakt = 40;
  while(vakt-- > 0){
    var sider = qa("[data-opsjonsside]");
    var siste = sider[sider.length - 1];
    if(!siste || siste.scrollHeight - siste.clientHeight <= 2) return;

    var rader = qa(".opsjonsrad", siste);
    if(rader.length < 2) return;

    var flyttet = [];
    while(rader.length > 1 && siste.scrollHeight - siste.clientHeight > 2){
      var r = rader.pop();
      flyttet.unshift(r);
      r.parentNode.removeChild(r);
    }
    if(!flyttet.length) return;

    var neste = nyttArk('<div class="innhold" data-opsjonsside="1">'+
      '<p class="eyebrow gra">Opsjoner fortsetter</p>'+
      '<div class="opsjonsboks" style="border-top:0;padding-top:0;margin-top:0"></div></div>');
    var mal2 = q(".opsjonsboks", neste);
    flyttet.forEach(function(x){ mal2.appendChild(x); });
    settInnEtter(siste, neste);
  }
}

/* Flytter rader som ikke faar plass over paa nye sider.
   Hoyden maales i nettleseren, saa det virker uansett hvor mye
   tekst som staar i hver celle. */
function delRomskjema(){
  var vakt = 60;
  while(vakt-- > 0){
    var sider = qa("[data-romside]");
    var siste = sider[sider.length - 1];
    if(!siste) return;
    if(siste.scrollHeight - siste.clientHeight <= 2) return;

    var tbody = q(".rom tbody", siste);
    if(!tbody || tbody.rows.length < 2) return;

    // flytt rader fra bunnen til innholdet faar plass
    var flyttet = [];
    while(tbody.rows.length > 1 && siste.scrollHeight - siste.clientHeight > 2){
      flyttet.unshift(tbody.rows[tbody.rows.length - 1]);
      tbody.deleteRow(tbody.rows.length - 1);
    }
    if(!flyttet.length) return;

    var nyttA = nyttArk('<div class="innhold" data-romside="1">'+
        '<p class="eyebrow gra">Romskjema fortsetter</p>'+
        '<table class="rom"><thead>'+q(".rom thead", siste).innerHTML+
        '</thead><tbody></tbody></table>'+
      '</div>');
    var nyTbody = q(".rom tbody", nyttA);
    flyttet.forEach(function(rad){ nyTbody.appendChild(rad); });
    settInnEtter(siste, nyttA);
  }
}

/* Kobler contenteditable-feltene tilbake til datamodellen. */
function bindFelt(){
  qa("[data-bind]").forEach(function(el){
    el.addEventListener("input", function(){
      var raa = el.getAttribute("data-fler")
        ? (typeof el.innerText === "string" ? el.innerText : el.textContent)
        : el.textContent;
      raa = String(raa == null ? "" : raa);
      var v = el.getAttribute("data-fler")
        ? raa.replace(/\n{3,}/g,"\n\n").replace(/\s+$/,"")
        : raa.trim();
      sett(el.getAttribute("data-bind"), v);
      sjekkFlyt();
    });
    el.addEventListener("paste", function(e){
      e.preventDefault();
      var t = (e.clipboardData || window.clipboardData).getData("text/plain");
      document.execCommand("insertText", false, t);
    });
  });
}

/* Varsler når innholdet ikke får plass på siden. */
function sjekkFlyt(){
  var over = 0;
  qa(".ark").forEach(function(a){
    var i = q(".innhold", a);
    var f = i ? (i.scrollHeight - i.clientHeight > 2) : false;
    a.classList.toggle("flyter", f);
    if(f) over++;
  });
  var s = q("#topp-status"), igjen = gjenstaar().length;
  s.className = "status";
  if(over){
    s.textContent = (over===1 ? "1 side" : over+" sider") + " flyter over";
    s.classList.add("varsel");
  } else if(igjen){
    s.textContent = "Utkast, " + igjen + (igjen===1 ? " ting mangler" : " ting mangler");
  } else {
    s.textContent = ORD("Klar til utsending","Klar til signering");
    s.classList.add("klar");
  }
  var stripe = q("#fremdrift");
  if(stripe) tegnFremdrift();
}

var visAlleSjekk = false;

function tegnFremdrift(){
  var boks = q("#fremdrift");
  if(!boks) return;
  var alle = sjekkliste();
  var ferdige = alle.filter(function(s){ return s.ok || s.sattTilSide; }).length;
  var igjen = alle.filter(function(s){ return !s.ok && !s.sattTilSide; });
  var flyt = qa(".ark.flyter").length;

  var stang = alle.map(function(s){
    return '<i class="'+(s.ok ? "ok" : (s.sattTilSide ? "side" : ""))+'"></i>';
  }).join("");

  var vis = visAlleSjekk ? alle : igjen;
  var punkter = vis.map(function(s){
    var kl = s.ok ? "ok" : (s.sattTilSide ? "side" : "");
    var ikon = s.ok ? "&#10003;" : (s.sattTilSide ? "&#8211;" : "&#9679;");
    var knapper = s.ok ? "" :
      '<div class="handling">'+
        '<button data-gjor="gadit" data-g="'+s.gruppe+'">Gå dit</button>'+
        '<button data-gjor="settside" data-id="'+s.id+'">'+(s.sattTilSide ? "Angre" : "Ikke akt.")+'</button>'+
      '</div>';
    return '<li class="'+kl+'"><span class="ikon">'+ikon+'</span>'+
      '<span>'+esc(s.tekst)+
        (!s.ok && !s.sattTilSide && s.hjelp ? '<span class="hjelp2">'+esc(s.hjelp)+'</span>' : "")+
      '</span>'+knapper+'</li>';
  }).join("");

  boks.innerHTML =
    '<div class="tall"><b>'+ferdige+' av '+alle.length+'</b><span>ferdig</span></div>'+
    '<div class="stang">'+stang+'</div>'+
    (igjen.length ? '<ul>'+punkter+'</ul>'
                  : '<div class="ferdig">&#10003; Alt er på plass. Utkast-stempelet er borte.</div>'+
                    (visAlleSjekk ? '<ul>'+punkter+'</ul>' : ""))+
    (flyt ? '<div class="flyt">'+(flyt===1?"1 side":flyt+" sider")+
            ' flyter over. Tekst blir borte i PDF-en. Kort ned, eller sett inn et sideskift.</div>' : "")+
    '<button class="vis-alle" data-gjor="visalle">'+
      (visAlleSjekk ? "Vis bare det som mangler" : "Vis hele listen")+'</button>';
}

/* ============================================================
   HANDLINGER I PANELET
   ============================================================ */
function listeFor(h){
  if(h.indexOf("blokk:")===0) return D.seksjoner[Number(h.split(":")[1])].blokker;
  if(h==="termin")  return D.kontrakt.betaling.rader;
  if(h==="prisrad") return D.pris.rader;
  if(h==="opsjon")  return D.opsjoner.rader;
  if(h==="romrad")  return D.rom.rader;
  if(h==="vedlegg") return D.vedlegg.rader;
  return null;
}
function flytt(arr,i,d){
  var j = i+d;
  if(j<0 || j>=arr.length) return;
  var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
}

q("#skuff").addEventListener("click", function(e){
  var b = e.target.closest("button");
  if(!b) return;

  if(b.hasAttribute("data-vipp")){
    var id = b.getAttribute("data-vipp");
    apneGrupper[id] = !apneGrupper[id];
    tegnSkuff(); return;
  }

  var g = b.getAttribute("data-gjor");
  if(!g) return;
  var i = Number(b.getAttribute("data-i"));

  if(g==="steg"){ D.steg[b.getAttribute("data-id")] = b.getAttribute("data-v"); }
  else if(g==="avsender"){
    var gammel = AVSENDERE[D.avsender].navn.replace(" AS","");
    D.avsender = b.getAttribute("data-v");
    if(!D.slutt.eyebrow || D.slutt.eyebrow === gammel){
      D.slutt.eyebrow = AVSENDERE[D.avsender].navn.replace(" AS","");
    }
  }
  else if(g==="kategori"){ D.kategori = b.getAttribute("data-v"); }
  else if(g==="person"){
    var pk = b.getAttribute("data-v"), pp = PERSONER[pk];
    D.pros.person = pk;
    D.pros.ansvarlig = pp.navn; D.pros.rolle = pp.rolle;
    D.pros.tlf = pp.tlf; D.pros.epost = pp.epost; D.pros.portrett = pp.portrett;
  }
  else if(g==="mva"){ D.pris.mva = b.getAttribute("data-v"); }
  else if(g==="omfang"){ D.omfang[i].s = b.getAttribute("data-v"); }
  else if(g==="prispa"){ D.pris.rader[i].pa = !D.pris.rader[i].pa; }
  else if(g==="sideskift"){
    var l = listeFor(b.getAttribute("data-h"));
    l[i].sideskift = !l[i].sideskift;
  }
  else if(g==="opp" || g==="ned"){
    flytt(listeFor(b.getAttribute("data-h")), i, g==="opp"?-1:1);
  }
  else if(g==="slett"){
    var arr = listeFor(b.getAttribute("data-h"));
    if(arr.length>1 || b.getAttribute("data-h")==="vedlegg") arr.splice(i,1);
  }
  else if(g==="nyblokk"){ D.seksjoner[i].blokker.push({m:"",t:"",liten:"",sideskift:false}); }
  else if(g==="nyomfang"){ D.omfang.push({t:"",s:"med"}); }
  else if(g==="nyprisrad"){ D.pris.rader.push({navn:"",beskr:"",belop:0,pa:true}); }
  else if(g==="nyopsjon"){ D.opsjoner.rader.push({navn:"",beskr:"",belop:0}); }
  else if(g==="nyromrad"){ D.rom.rader.push({rom:"",gulv:"",vegg:"",himling:"",elektro:"Eget oppsett",ror:"",annet:""}); }
  else if(g==="nyromgruppe"){ D.rom.rader.push({gruppe:true,rom:"Ny overskrift"}); }
  else if(g==="nyprodukt"){ D.produkt.rader.push({k:"",v:""}); }
  else if(g==="nyvedlegg"){ D.vedlegg.rader.push({navn:"",note:""}); }
  else if(g==="nytermin"){
    var tr = D.kontrakt.betaling.rader;
    // den nye legges foran restraden, og faar det restraden hadde
    if(tr.length){
      var sisteAndel = terminOppsett(100).andeler[tr.length-1];
      tr.splice(tr.length - 1, 0, {navn:"Ny termin", nar:"", andel:Math.max(0, sisteAndel)});
    } else {
      tr.push({navn:"Termin 1", nar:"", andel:100});
    }
  }
  else if(g==="hentmal"){ hentStandardtekst(); }
  else if(g==="bilde"){ ventendeBilde = b.getAttribute("data-mal"); q("#fil-bilde").click(); return; }
  else if(g==="pdf"){ ventendeBilde = b.getAttribute("data-mal"); pdfAuto = true;  q("#fil-pdf").click(); return; }
  else if(g==="pdfvelg"){ ventendeBilde = b.getAttribute("data-mal"); pdfAuto = false; q("#fil-pdf").click(); return; }
  else if(g==="xlsx"){ q("#fil-xlsx").click(); return; }
  else if(g==="nullstillbilde"){ D.forside.posX = 50; D.forside.posY = 50; D.forside.zoom = 100; }
  else if(g==="logostil"){
    if(typeof D.forside.logostil === "string" || !D.forside.logostil) D.forside.logostil = {};
    D.forside.logostil[D.avsender] = b.getAttribute("data-v");
  }
  else if(g==="nyversjon"){
    D.pros.versjon = (Number(D.pros.versjon)||1) + 1;
    D.pros.dato = idag();
  }
  else if(g==="lagrejson"){ lagreJson(); return; }
  else if(g==="visalle"){ visAlleSjekk = !visAlleSjekk; tegnFremdrift(); return; }
  else if(g==="settside"){
    var sid = b.getAttribute("data-id");
    if(D.hoppOver[sid]) delete D.hoppOver[sid]; else D.hoppOver[sid] = true;
    tegnFremdrift(); render(); return;
  }
  else if(g==="gadit"){
    var gid = b.getAttribute("data-g");
    Object.keys(apneGrupper).forEach(function(k){ apneGrupper[k] = false; });
    apneGrupper[gid] = true;
    tegnSkuff();
    var mal = q('[data-gruppe="'+gid+'"]');
    if(mal && mal.scrollIntoView) mal.scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
  else if(g==="fjernbilde"){ sett(b.getAttribute("data-mal"), ""); }
  else return;

  tegnSkuff(); render();
});

/* Skriver panelfelt tilbake til modellen uten å tegne panelet på nytt. */
q("#skuff").addEventListener("input", function(e){
  var el = e.target;
  if(el.hasAttribute("data-sti")){
    sett(el.getAttribute("data-sti"), el.hasAttribute("data-tall") ? talltil(el.value) : el.value);
    if(el.type === "range"){
      var merke = el.previousElementSibling && el.previousElementSibling.querySelector("span");
      if(merke) merke.textContent = merke.textContent.replace(/^[\d.-]+/, el.value);
    }
    renderSnart(); return;
  }
  if(el.hasAttribute("data-belop")){
    var sti = el.getAttribute("data-belop");
    var inn = talltil(el.value);
    var eks = el.getAttribute("data-side") === "inkl" ? inn / 1.25 : inn;
    sett(sti, eks);
    var motsatt = el.getAttribute("data-side") === "inkl" ? "eks" : "inkl";
    var annen = q('[data-belop="' + sti + '"][data-side="' + motsatt + '"]', q("#skuff"));
    if(annen){
      annen.value = el.value === "" ? "" :
        String(Math.round(motsatt === "inkl" ? eks * 1.25 : eks));
    }
    renderSnart(); return;
  }
  if(el.hasAttribute("data-kol")){
    D.rom.kol[el.getAttribute("data-kol")] = el.checked;
    tegnSkuff(); render(); return;
  }
  if(el.hasAttribute("data-produktvis")){
    D.produkt.vis = el.checked;
    tegnSkuff(); render();
  }
});

/* Bytter mellom tilbud og kontrakt. Alt som gjelder selve
   prosjektet beholdes. Bare tekstene som handler om hva slags
   dokument dette er, byttes ut. */
function byttDokumenttype(){
  var ny = (DOK === "kontrakt") ? "tilbud" : "kontrakt";
  var advarsel = (ny === "kontrakt")
    ? "Dette gjør dokumentet om til en kontrakt.\n\nPris, beskrivelse, romskjema, vedlegg og bilder beholdes. Brevteksten på side 2, forsiden og avslutningen byttes til kontraktversjonen, og du mister det du eventuelt har skrevet om selv der.\n\nDu får en ny side med parter, betalingsplan og signatur.\n\nFortsette?"
    : "Dette gjør dokumentet tilbake til et tilbud.\n\nKontraktssiden med parter, betalingsplan og signatur forsvinner fra dokumentet, men det du har fylt inn der blir liggende hvis du gjør det om igjen.\n\nFortsette?";
  if(!window.confirm(advarsel)) return false;

  DOK = ny;
  D.doktype = ny;
  var f = nyeData();                       // fersk mal for den nye typen

  D.forside.eyebrow  = f.forside.eyebrow;
  D.forside.ingress  = f.forside.ingress;
  D.brev.overskrift  = f.brev.overskrift;
  D.brev.avsnitt     = f.brev.avsnitt.slice();
  D.brev.sidefelt    = f.brev.sidefelt.map(function(r){ return {k:r.k, v:r.v}; });
  D.omfangTittel     = f.omfangTittel;
  D.omfangNote       = f.omfangNote;
  D.slutt.tittel     = f.slutt.tittel;
  D.slutt.tekst      = f.slutt.tekst;
  if(D.veien.trinn[0]) D.veien.trinn[0] = {h:f.veien.trinn[0].h, p:f.veien.trinn[0].p};

  // nytt dokument, ny telling
  D.pros.versjon = 1;
  D.pros.dato = idag();

  if(ny === "kontrakt" && !String(D.kontrakt.forbruker.navn||"").trim()){
    D.kontrakt.forbruker.navn = D.pros.kunde || "";
  }
  return true;
}

function hentStandardtekst(){
  var mal = MALER[D.kategori];
  if(!mal){ window.alert("Ingen standardtekst for denne kategorien."); return; }
  if(!window.confirm("Dette erstatter beskrivelsen og omfangslisten med standardteksten for " +
     KATEGORIER[D.kategori].navn.toLowerCase() + ".\n\nAlt du har skrevet i de to delene forsvinner. Fortsette?")) return;
  D.seksjoner[0].blokker = mal.utvendig.map(function(b){return {m:b.m,t:b.t,liten:"",sideskift:false};});
  D.seksjoner[1].blokker = mal.innvendig.map(function(b){return {m:b.m,t:b.t,liten:"",sideskift:false};});

}

/* ============================================================
   HVIT LOGOVARIANT

   Lages en gang per logo, ved aa male alle synlige piksler hvite
   og beholde gjennomsiktigheten. Brukes naar logoen ligger rett
   paa et morkt bilde.
   ============================================================ */
function lagHvitLogo(nokkel){
  var a = AVSENDERE[nokkel];
  if(!a || !a.logo || a.logoHvit) return;
  var im = new Image();
  im.onload = function(){
    var c = document.createElement("canvas");
    c.width = im.width; c.height = im.height;
    var ctx = c.getContext("2d");
    ctx.drawImage(im, 0, 0);
    try {
      var bd = ctx.getImageData(0, 0, c.width, c.height);
      var p = bd.data, n = p.length / 4, gjennomsiktige = 0, i;

      for(i = 3; i < p.length; i += 4){ if(p[i] < 200) gjennomsiktige++; }

      if(gjennomsiktige / n > 0.05){
        // logoen har alfakanal: alt synlig males hvitt
        for(i = 0; i < p.length; i += 4){
          if(p[i+3] > 0){ p[i] = 255; p[i+1] = 255; p[i+2] = 255; }
        }
      } else {
        // logoen ligger på hvit flate: lysheten brukes som maske,
        // slik at bakgrunnen blir gjennomsiktig i stedet for hvit
        for(i = 0; i < p.length; i += 4){
          var lys = (p[i] + p[i+1] + p[i+2]) / 3;
          p[i] = 255; p[i+1] = 255; p[i+2] = 255;
          p[i+3] = lys >= 236 ? 0 : Math.round(255 * Math.min(1, (236 - lys) / 55));
        }
      }
      ctx.putImageData(bd, 0, 0);
      a.logoHvit = c.toDataURL("image/png");
      render();
    } catch(e){ /* uten logo i hvit variant faller vi tilbake til original */ }
  };
  im.src = a.logo;
}
function lagAlleHvitLogoer(){
  Object.keys(AVSENDERE).forEach(lagHvitLogo);
}

/* Maaler hvor lyst forsidebildet er der logoen ligger. */
function maalToppLys(lerret){
  try {
    var b = Math.max(1, Math.round(lerret.width * 0.34));
    var hh = Math.max(1, Math.round(lerret.height * 0.20));
    var d = lerret.getContext("2d").getImageData(0, 0, b, hh).data;
    var sum = 0, n = 0;
    for(var i = 0; i < d.length; i += 40){
      sum += (d[i] + d[i+1] + d[i+2]) / 3;
      n++;
    }
    return n ? Math.round(sum / n) : null;
  } catch(e){ return null; }
}

function skaler(fil, maksbredde, kvalitet, ferdig){
  var les = new FileReader();
  les.onload = function(){
    var im = new Image();
    im.onload = function(){
      var w = im.width, h = im.height;
      if(w > maksbredde){ h = Math.round(h*maksbredde/w); w = maksbredde; }
      var c = document.createElement("canvas");
      c.width = w; c.height = h;
      var ctx = c.getContext("2d");
      ctx.drawImage(im, 0, 0, w, h);
      var gjennomsiktig = /^data:image\/png/.test(les.result);
      ferdig(gjennomsiktig ? c.toDataURL("image/png") : c.toDataURL("image/jpeg", kvalitet), c);
    };
    im.onerror = function(){ window.alert("Klarte ikke å lese bildefilen."); };
    im.src = les.result;
  };
  les.readAsDataURL(fil);
}

/* ============================================================
   HENT BILDE FRA PDF

   pdf.js ligger gzip-pakket i to script-blokker nederst i filen.
   Den pakkes ut og lastes forste gang noen trykker «Hent fra PDF»,
   slik at oppstarten holder seg rask. Ingenting hentes fra nett.
   ============================================================ */
var pdfLib = null;          // modulen, lastet ved forste bruk
var pdfDok = null;          // apen PDF
var pdfSide = 1;
var pdfLerret = q("#pdf-lerret");
var pdfMal = null;          // hvor bildet skal
var pdfDrar = null;         // {x0,y0,x1,y1} i lerretets piksler
var pdfAuto = false;        // true = ta side 1 rett inn

function pdfSi(tekst){ q("#pdf-beskjed").textContent = tekst; }

function pakkUt(id){
  var b64 = document.getElementById(id).textContent.trim();
  var raa = atob(b64);
  var bytes = new Uint8Array(raa.length);
  for(var i=0;i<raa.length;i++){ bytes[i] = raa.charCodeAt(i); }
  if(typeof DecompressionStream !== "function"){
    return Promise.reject(new Error("nettleser"));
  }
  var strom = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new Response(strom).arrayBuffer();
}

function lastPdfLib(){
  if(pdfLib) return Promise.resolve(pdfLib);
  pdfSi("Gjør klar PDF-leseren.");
  return Promise.all([pakkUt("pdfjs-kode"), pakkUt("pdfjs-worker")])
    .then(function(deler){
      var typen = {type:"text/javascript"};
      var lib = URL.createObjectURL(new Blob([deler[0]], typen));
      var wrk = URL.createObjectURL(new Blob([deler[1]], typen));
      return import(/* webpackIgnore: true */ lib).then(function(m){
        m.GlobalWorkerOptions.workerSrc = wrk;
        pdfLib = m;
        return m;
      });
    });
}

function tegnPdfSide(){
  return pdfDok.getPage(pdfSide).then(function(side){
    // Rendres stort, vises nedskalert. Da holder utsnittet kvaliteten.
    var basis = side.getViewport({scale:1});
    var skala = Math.min(Math.max(2600 / basis.width, 1.2), 4);
    var vp = side.getViewport({scale:skala});
    pdfLerret.width = Math.round(vp.width);
    pdfLerret.height = Math.round(vp.height);
    return side.render({canvasContext:pdfLerret.getContext("2d"), viewport:vp}).promise;
  }).then(function(){
    q("#pdf-ramme").hidden = false;
    q("#pdf-utsnitt").hidden = true;
    pdfDrar = null;
    q("#pdf-bruk").disabled = true;
    q("#pdf-hele").disabled = false;
    q("#pdf-forrige").disabled = pdfSide <= 1;
    q("#pdf-neste").disabled = pdfSide >= pdfDok.numPages;
    q("#pdf-sidetall").textContent = "Side " + pdfSide + " av " + pdfDok.numPages;
    pdfSi("Dra et rektangel over det du vil bruke, eller ta hele siden.");
  });
}

function apnePdf(fil, mal){
  pdfMal = mal;
  document.body.classList.add("modal-apen");
  q("#pdf-ramme").hidden = true;
  q("#pdf-sidetall").textContent = "";
  ["pdf-bruk","pdf-hele","pdf-forrige","pdf-neste"].forEach(function(id){ q("#"+id).disabled = true; });
  pdfSi("Leser filen.");

  lastPdfLib()
    .then(function(lib){ return fil.arrayBuffer().then(function(buf){
      return lib.getDocument({data:new Uint8Array(buf)}).promise;
    }); })
    .then(function(dok){ pdfDok = dok; pdfSide = 1; return tegnPdfSide(); })
    .then(function(){
      if(!pdfAuto) return;
      pdfAuto = false;
      var t = trimHvitt();
      if(t) taUtBilde(t.x, t.y, t.b, t.h);
      else   taUtBilde(0, 0, pdfLerret.width, pdfLerret.height);
    })
    .catch(function(err){
      if(err && err.message === "nettleser"){
        pdfSi("Denne nettleseren kan ikke pakke ut PDF-leseren. Åpne filen i Chrome eller Edge, eller lagre siden som bilde og last den opp i stedet.");
      } else {
        pdfSi("Klarte ikke å lese PDF-en. Den kan være passordbeskyttet eller skadet. Lagre siden som bilde og last den opp i stedet.");
      }
    });
}

/* dra utsnittet */
function lerretPunkt(e){
  var r = pdfLerret.getBoundingClientRect();
  var fx = pdfLerret.width / r.width, fy = pdfLerret.height / r.height;
  return {
    x: Math.max(0, Math.min(pdfLerret.width,  (e.clientX - r.left) * fx)),
    y: Math.max(0, Math.min(pdfLerret.height, (e.clientY - r.top) * fy))
  };
}
function tegnUtsnitt(){
  var boks = q("#pdf-utsnitt");
  if(!pdfDrar){ boks.hidden = true; return; }
  var r = pdfLerret.getBoundingClientRect();
  var rr = q("#pdf-ramme").getBoundingClientRect();
  var fx = r.width / pdfLerret.width, fy = r.height / pdfLerret.height;
  var x = Math.min(pdfDrar.x0, pdfDrar.x1), y = Math.min(pdfDrar.y0, pdfDrar.y1);
  var b = Math.abs(pdfDrar.x1 - pdfDrar.x0), hh = Math.abs(pdfDrar.y1 - pdfDrar.y0);
  boks.hidden = false;
  boks.style.left   = ((r.left - rr.left) + x*fx) + "px";
  boks.style.top    = ((r.top  - rr.top ) + y*fy) + "px";
  boks.style.width  = (b*fx) + "px";
  boks.style.height = (hh*fy) + "px";
}
pdfLerret.addEventListener("pointerdown", function(e){
  var p = lerretPunkt(e);
  pdfDrar = {x0:p.x, y0:p.y, x1:p.x, y1:p.y};
  pdfLerret.setPointerCapture(e.pointerId);
  tegnUtsnitt();
});
pdfLerret.addEventListener("pointermove", function(e){
  if(!pdfDrar || !pdfLerret.hasPointerCapture(e.pointerId)) return;
  var p = lerretPunkt(e);
  pdfDrar.x1 = p.x; pdfDrar.y1 = p.y;
  tegnUtsnitt();
});
pdfLerret.addEventListener("pointerup", function(e){
  if(!pdfDrar) return;
  pdfLerret.releasePointerCapture(e.pointerId);
  var b = Math.abs(pdfDrar.x1-pdfDrar.x0), hh = Math.abs(pdfDrar.y1-pdfDrar.y0);
  var stort_nok = b > 30 && hh > 30;
  q("#pdf-bruk").disabled = !stort_nok;
  if(!stort_nok){ pdfDrar = null; tegnUtsnitt(); }
});

/* PDF-sider har hvite marger. Uten trimming maa brukeren zoome
   manuelt for at forsiden skal dekkes helt. */
function trimHvitt(){
  var ctx = pdfLerret.getContext("2d");
  var d;
  try { d = ctx.getImageData(0, 0, pdfLerret.width, pdfLerret.height).data; }
  catch(e){ return null; }
  var steg = Math.max(1, Math.round(pdfLerret.width / 800));
  var x0 = pdfLerret.width, y0 = pdfLerret.height, x1 = -1, y1 = -1;
  for(var y = 0; y < pdfLerret.height; y += steg){
    for(var x = 0; x < pdfLerret.width; x += steg){
      var i = (y * pdfLerret.width + x) * 4;
      if(d[i] < 244 || d[i+1] < 244 || d[i+2] < 244){
        if(x < x0) x0 = x;
        if(x > x1) x1 = x;
        if(y < y0) y0 = y;
        if(y > y1) y1 = y;
      }
    }
  }
  if(x1 <= x0 || y1 <= y0) return null;
  x0 = Math.max(0, x0 - steg); y0 = Math.max(0, y0 - steg);
  x1 = Math.min(pdfLerret.width  - 1, x1 + steg);
  y1 = Math.min(pdfLerret.height - 1, y1 + steg);
  var b = x1 - x0 + 1, hh = y1 - y0 + 1;
  // hvis nesten hele siden er innhold, er det ikke noe aa hente
  var utsnitt = {x:x0, y:y0, b:b, h:hh};
  if(b > pdfLerret.width * 0.985 && hh > pdfLerret.height * 0.985){
    utsnitt = {x:0, y:0, b:pdfLerret.width, h:pdfLerret.height};
  }
  return kuttTittelstripe(utsnitt, d);
}

/* Tegningsforsider har et bilde oeverst og en lys tittelstripe med
   logo og prosjektnavn nederst. Stripen skal ikke inn i tilbudet. */
function kuttTittelstripe(u, d){
  function lyshet(y){
    var sum = 0, n = 0, steg = Math.max(1, Math.round(u.b / 220));
    for(var x = u.x; x < u.x + u.b; x += steg){
      var i = (y * pdfLerret.width + x) * 4;
      sum += (d[i] + d[i+1] + d[i+2]) / 3;
      n++;
    }
    return n ? sum / n : 255;
  }
  // hopp over den tynne ramma helt nederst
  var start = u.y + u.h - 1 - Math.round(u.h * 0.02);
  if(start <= u.y) return u;

  var y = start, morke = 0;
  while(y > u.y){
    if(lyshet(y) > 178){ morke = 0; }
    else if(++morke > 3){ break; }
    y--;
  }
  y += morke;                       // tilbake til foerste lyse rad
  var stripe = start - y;
  if(stripe < u.h * 0.05 || stripe > u.h * 0.35) return u;   // ingen tydelig stripe
  if(lyshet(Math.max(u.y, y - 4)) > 130) return u;           // for lite sprang til aa vaere sikker

  u.h = Math.max(1, y - u.y);
  return u;
}

function taUtBilde(x, y, b, hh){
  var maks = 1600;
  var ut = document.createElement("canvas");
  var s = Math.min(1, maks / b);
  ut.width = Math.round(b*s); ut.height = Math.round(hh*s);
  ut.getContext("2d").drawImage(pdfLerret, x, y, b, hh, 0, 0, ut.width, ut.height);
  sett(pdfMal, ut.toDataURL("image/jpeg", 0.85));
  if(pdfMal === "forside.bilde"){
    D.forside.posX = 50; D.forside.posY = 50; D.forside.zoom = 100;
    D.forside.toppLys = maalToppLys(ut);
  }
  lukkPdf();
  tegnSkuff(); render();
}

/* ============================================================
   LES ROMSKJEMA FRA EXCEL

   En xlsx-fil er en zip. Vi leser sentralkatalogen, pakker ut de
   arkene vi trenger med nettleserens egen DecompressionStream, og
   tolker XML-en med DOMParser. Ingen eksterne bibliotek.
   ============================================================ */
function lesZip(buf){
  var d = new DataView(buf), b = new Uint8Array(buf);
  // finn slutten av sentralkatalogen
  var eocd = -1;
  for(var i = b.length - 22; i >= 0 && i > b.length - 66000; i--){
    if(d.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error("ikke en zip");
  var antall = d.getUint16(eocd + 10, true);
  var start  = d.getUint32(eocd + 16, true);
  var filer = [], p = start, dek = new TextDecoder("utf-8");
  for(var n = 0; n < antall; n++){
    if(d.getUint32(p, true) !== 0x02014b50) break;
    var metode  = d.getUint16(p + 10, true);
    var komp    = d.getUint32(p + 20, true);
    var navnLen = d.getUint16(p + 28, true);
    var ekstra  = d.getUint16(p + 30, true);
    var komm    = d.getUint16(p + 32, true);
    var lokal   = d.getUint32(p + 42, true);
    var navn    = dek.decode(b.subarray(p + 46, p + 46 + navnLen));
    filer.push({navn:navn, metode:metode, komp:komp, lokal:lokal});
    p += 46 + navnLen + ekstra + komm;
  }
  return {
    navn: filer.map(function(f){ return f.navn; }),
    hent: function(navn){
      var f = null;
      for(var i = 0; i < filer.length; i++){ if(filer[i].navn === navn){ f = filer[i]; break; } }
      if(!f) return Promise.resolve(null);
      var lnavn = d.getUint16(f.lokal + 26, true);
      var lekstra = d.getUint16(f.lokal + 28, true);
      var fra = f.lokal + 30 + lnavn + lekstra;
      var rå = b.subarray(fra, fra + f.komp);
      if(f.metode === 0) return Promise.resolve(dek.decode(rå));
      if(typeof DecompressionStream !== "function") return Promise.reject(new Error("nettleser"));
      var strøm = new Blob([rå]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return new Response(strøm).text();
    }
  };
}

function kolonneNr(ref){                       // "AB12" -> 27
  var n = 0;
  for(var i = 0; i < ref.length; i++){
    var k = ref.charCodeAt(i);
    if(k < 65 || k > 90) break;
    n = n * 26 + (k - 64);
  }
  return n - 1;
}

function arkTilRader(xml, delte){
  var dok = new DOMParser().parseFromString(xml, "application/xml");
  var rader = [];
  Array.prototype.forEach.call(dok.getElementsByTagName("row"), function(rad){
    var celler = [];
    Array.prototype.forEach.call(rad.getElementsByTagName("c"), function(c){
      var k = kolonneNr(c.getAttribute("r") || "A1");
      var t = c.getAttribute("t"), v = "";
      if(t === "inlineStr"){
        var is = c.getElementsByTagName("t");
        for(var j = 0; j < is.length; j++){ v += is[j].textContent; }
      } else {
        var vn = c.getElementsByTagName("v")[0];
        if(vn){ v = (t === "s") ? (delte[Number(vn.textContent)] || "") : vn.textContent; }
      }
      celler[k] = String(v).replace(/\s+/g, " ").trim();
    });
    for(var i = 0; i < celler.length; i++){ if(celler[i] === undefined) celler[i] = ""; }
    rader.push(celler);
  });
  return rader;
}

/* Finner hvilken kolonne som er hva, ut fra overskriftsraden. */
var KOLNØKLER = [
  ["romnr",   ["romnr","rom nr","romnummer","nr"]],
  ["rom",     ["rom","navn"]],
  ["gulv",    ["gulv"]],
  ["vegg",    ["vegg"]],
  ["himling", ["himling","tak"]],
  ["elektro", ["elektro","elektriker"]],
  ["ror",     ["rør","ror","rørlegger"]],
  ["annet",   ["annet","merknad"]]
];
function finnKolonner(rad){
  var kart = {}, treff = 0, brukt = {};
  // nøklene prøves i rekkefølge, slik at «Romnr» ikke stjeler «Rom»
  KOLNØKLER.forEach(function(par){
    for(var i = 0; i < rad.length; i++){
      if(brukt[i]) continue;
      var s = String(rad[i] == null ? "" : rad[i]).toLowerCase().trim();
      if(!s) continue;
      for(var j = 0; j < par[1].length; j++){
        if(s.indexOf(par[1][j]) === 0){
          kart[par[0]] = i; brukt[i] = true; treff++;
          return;
        }
      }
    }
  });
  return (kart.rom !== undefined && treff >= 3) ? kart : null;
}

function tolkArbeidsbok(zip){
  var ark = zip.navn.filter(function(n){ return /^xl\/worksheets\/sheet\d+\.xml$/.test(n); })
    .sort(function(a,b){
      return Number(a.match(/(\d+)/)[1]) - Number(b.match(/(\d+)/)[1]);
    });
  return zip.hent("xl/sharedStrings.xml").then(function(ss){
    var delte = [];
    if(ss){
      var d = new DOMParser().parseFromString(ss, "application/xml");
      Array.prototype.forEach.call(d.getElementsByTagName("si"), function(si){
        var s = "", ts = si.getElementsByTagName("t");
        for(var i = 0; i < ts.length; i++){ s += ts[i].textContent; }
        delte.push(s.replace(/\s+/g, " ").trim());
      });
    }
    return Promise.all(ark.map(function(n){ return zip.hent(n); }))
      .then(function(xmler){
        return xmler.map(function(x){ return arkTilRader(x, delte); });
      });
  });
}

function importerRomskjema(fil){
  fil.arrayBuffer().then(function(buf){
    return tolkArbeidsbok(lesZip(buf));
  }).then(function(alleArk){
    var romrader = [], produkt = [], funnetRom = false, funnetProdukt = false;

    alleArk.forEach(function(rader){
      // finn overskriftsraden
      var kart = null, hodeRad = -1;
      for(var i = 0; i < Math.min(rader.length, 12); i++){
        kart = finnKolonner(rader[i]);
        if(kart){ hodeRad = i; break; }
      }
      if(kart){
        funnetRom = true;
        var tomme = 0, slutt = rader.length;
        for(var r = hodeRad + 1; r < rader.length; r++){
          var rad = rader[r];
          var noe = rad.some(function(c){ return String(c).trim(); });
          if(!noe){
            // to tomme rader pa rad betyr at tabellen er slutt
            if(++tomme >= 2){ slutt = r - 1; break; }
            continue;
          }
          tomme = 0;
          var navn = String(rad[kart.rom] || "").trim();
          var nr = kart.romnr !== undefined ? String(rad[kart.romnr] || "").trim() : "";
          if(!navn && !nr) continue;
          romrader.push({
            rom:(nr ? nr + " " : "") + navn,
            gulv:    kart.gulv    !== undefined ? (rad[kart.gulv]    || "") : "",
            vegg:    kart.vegg    !== undefined ? (rad[kart.vegg]    || "") : "",
            himling: kart.himling !== undefined ? (rad[kart.himling] || "") : "",
            elektro: kart.elektro !== undefined ? (rad[kart.elektro] || "") : "",
            ror:     kart.ror     !== undefined ? (rad[kart.ror]     || "") : "",
            annet:   kart.annet   !== undefined ? (rad[kart.annet]   || "") : ""
          });
        }
        // det som star under tabellen, som gulvlister og taklister,
        // hoerer hjemme blant produktene
        for(var r3 = slutt; r3 < rader.length; r3++){
          var rd3 = rader[r3];
          var k3 = String(rd3[0] || "").trim();
          if(!k3) continue;
          var v3 = rd3.slice(1).map(function(c){ return String(c).trim(); })
                    .filter(Boolean).join(", ");
          produkt.push({k:k3, v:v3});
          funnetProdukt = true;
        }
        return;
      }
      // ellers: se om arket er produktinfo
      var hode = -1;
      for(var i2 = 0; i2 < Math.min(rader.length, 12); i2++){
        if(String(rader[i2][0] || "").toLowerCase().indexOf("produkt") === 0){ hode = i2; break; }
      }
      if(hode < 0) return;
      funnetProdukt = true;
      for(var r2 = hode + 1; r2 < rader.length; r2++){
        var rd = rader[r2];
        var k = (rd[0] || "").trim();
        if(!k) continue;
        var v = rd.slice(1).map(function(c){ return String(c).trim(); })
                 .filter(Boolean).join(", ");
        produkt.push({k:k, v:v});
      }
    });

    if(!funnetRom && !funnetProdukt){
      window.alert("Fant ingen romskjematabell i filen.\n\nArket må ha en overskriftsrad med Rom, Gulv, Vegg og gjerne Himling, Elektro, Rør og Annet. Bruk malen Romskjema.xlsx.");
      return;
    }
    var melding = [];
    if(funnetRom) melding.push(romrader.length + " rom");
    if(funnetProdukt) melding.push(produkt.length + " produktlinjer");
    if(!window.confirm("Fant " + melding.join(" og ") + ".\n\nDette erstatter romskjemaet som ligger inne nå. Fortsette?")) return;

    if(funnetRom) D.rom.rader = romrader;
    if(funnetProdukt){ D.produkt.rader = produkt; D.produkt.vis = true; }
    tegnSkuff(); render();
  }).catch(function(err){
    if(err && err.message === "nettleser"){
      window.alert("Denne nettleseren kan ikke pakke ut Excel-filer. Åpne verktøyet i Chrome eller Edge.");
    } else {
      window.alert("Klarte ikke å lese filen. Er den lagret som .xlsx?\n\n(" + (err && err.message ? err.message : "ukjent feil") + ")");
    }
  });
}

q("#fil-xlsx").addEventListener("change", function(e){
  var f = e.target.files[0];
  if(f) importerRomskjema(f);
  e.target.value = "";
});

render();

})();
